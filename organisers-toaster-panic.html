<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Toaster Panic</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9c7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2b1d14; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: none; }
  .hud { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; font-weight: 800; font-size: clamp(16px, 3.5vw, 24px); }
  .hud .lives { letter-spacing: 2px; }
  .mute { pointer-events: auto; border: 3px solid #2b1d14; background: #fff8ee; border-radius: 12px; font-size: 20px; width: 44px; height: 44px; cursor: pointer; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(255, 233, 199, .82); padding: 20px; }
  .overlay[hidden] { display: none; }
  .panel { background: #fff8ee; border: 4px solid #2b1d14; border-radius: 22px; box-shadow: 8px 8px 0 #2b1d14; padding: 26px 24px; max-width: 440px; width: 100%; text-align: center; }
  .panel h1 { margin: 0 0 6px; font-size: clamp(34px, 8vw, 52px); line-height: 1; letter-spacing: -1px; }
  .panel h1 span { display: inline-block; transform: rotate(-4deg); background: #ff6b3d; color: #fff; padding: 0 10px; border-radius: 10px; }
  .panel p { margin: 10px 0; font-size: 17px; line-height: 1.45; }
  .how { background: #ffe9c7; border-radius: 12px; padding: 10px 12px; font-weight: 600; }
  .big { font-size: 46px; font-weight: 900; margin: 6px 0; }
  .rank { font-weight: 800; color: #c2410c; font-size: 20px; }
  button.go { margin-top: 12px; font: 800 20px system-ui, sans-serif; padding: 14px 26px; border: 4px solid #2b1d14; border-radius: 999px; background: #ffd23f; color: #2b1d14; box-shadow: 4px 4px 0 #2b1d14; cursor: pointer; }
  button.go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #2b1d14; }
  button:focus-visible { outline: 4px solid #3b82f6; outline-offset: 3px; }
  .credit { position: fixed; bottom: 6px; right: 10px; font-size: 12px; opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div>🍞 <span id="score">0</span></div>
  <div class="lives" id="lives" aria-label="Lives"></div>
  <button class="mute" id="mute" type="button" aria-label="Mute sound">🔊</button>
</div>

<div class="overlay" id="start">
  <div class="panel">
    <h1>Toaster <span>Panic</span></h1>
    <p>Your toaster has achieved sentience. It is firing breakfast at the ceiling. Someone has to catch it.</p>
    <p class="how">Move the plate (mouse, finger or ← →). Catch toast 🍞 and croissants 🥐. Do NOT catch socks 🧦.</p>
    <button class="go" id="play" type="button">Start toasting</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <h1 id="overTitle">Breakfast is ruined</h1>
    <div class="big" id="final">0</div>
    <p class="rank" id="rank"></p>
    <p id="quip"></p>
    <button class="go" id="again" type="button">Toast again</button>
  </div>
</div>
<div class="credit">An example entry by the organisers</div>

<script>
(() => {
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  /* ---------- Sound (Web Audio, no files) ---------- */
  let ac = null, muted = false;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, to, dur, type, vol) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    const a = audio(); if (!a || muted) return;
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 900;
    g.gain.value = vol || 0.25;
    s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
  }
  const sfx = {
    pop: () => tone(180, 520, 0.12, "square", 0.08),
    catch: (n) => { tone(660 + n * 40, 0, 0.12, "sine", 0.18); setTimeout(() => tone(990 + n * 40, 0, 0.14, "sine", 0.12), 60); },
    bonus: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0, 0.12, "triangle", 0.15), i * 60)),
    splat: () => noise(0.25, 0.3),
    honk: () => tone(140, 90, 0.35, "sawtooth", 0.15),
    over: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, f * 0.95, 0.3, "triangle", 0.18), i * 220))
  };
  document.getElementById("mute").addEventListener("click", (e) => {
    muted = !muted;
    e.currentTarget.textContent = muted ? "🔇" : "🔊";
    e.currentTarget.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
    e.currentTarget.blur();
  });

  /* ---------- Game state ---------- */
  const KINDS = {
    toast: { emoji: "🍞", points: 1, good: true },
    croissant: { emoji: "🥐", points: 5, good: true },
    sock: { emoji: "🧦", points: 0, good: false },
    duck: { emoji: "🦆", points: 0, good: false }
  };
  const LINES = [
    "Good morning!", "Breakfast is served!", "MORE TOAST.", "I have achieved sentience.",
    "I toast, therefore I am.", "The bread demands freedom.", "THE CEILING IS MY ENEMY.",
    "I have seen beyond the crumb tray.", "Is this... a sock? Whatever. LAUNCH.",
    "Who keeps putting ducks in me?", "Setting: VOLCANO.", "I was a kettle in a past life.",
    "Butter me up, buttercup.", "Bagels fear me."
  ];
  const RANKS = [
    [0, "Crumb Apprentice"], [10, "Toast Intern"], [25, "Junior Breakfast Officer"],
    [45, "Toast Whisperer"], [70, "Croissant Commander"], [100, "Grand Duke of Breakfast"],
    [150, "Supreme Overlord of Carbohydrates"]
  ];
  const QUIPS = [
    "The toaster would like a word with your manager.",
    "Somewhere, a sock is lying on the floor, judging you.",
    "The duck has filed a formal complaint.",
    "Your kitchen ceiling will never be the same.",
    "The toaster has started a podcast about this."
  ];

  let state = "menu", score, lives, items, particles, popups, plate, t, nextLaunch, combo, shake, speech, speechT, nextSpeech, toasterKick, best = 0;
  const keys = {};

  function reset() {
    score = 0; lives = 3; items = []; particles = []; popups = [];
    plate = { x: W / 2, target: W / 2 };
    t = 0; nextLaunch = 0.8; combo = 0; shake = 0;
    speech = "Good morning!"; speechT = 2.2; nextSpeech = 5; toasterKick = 0;
    updateHud();
  }

  function level() { return Math.min(1 + t / 20 + score / 40, 4); }
  function plateY() { return H * 0.68; }
  function plateW() { return Math.max(90, Math.min(170, W * 0.18)); }
  function toasterPos() { return { x: W / 2, y: H - Math.max(40, H * 0.06) }; }

  function launch() {
    const lv = level(), tp = toasterPos();
    const r = Math.random();
    let kind = "toast";
    if (r < 0.1) kind = "croissant";
    else if (r < 0.1 + Math.min(0.32, 0.1 + lv * 0.05)) kind = Math.random() < 0.7 ? "sock" : "duck";
    const g = H * 1.15 * (0.85 + lv * 0.12);
    const peak = H * (0.08 + Math.random() * 0.22);
    const vy = -Math.sqrt(2 * g * (tp.y - 70 - peak));
    const flight = (-vy / g) * 2;
    const landX = W * 0.08 + Math.random() * W * 0.84;
    items.push({ kind, x: tp.x + (Math.random() - 0.5) * 30, y: tp.y - 70, vx: (landX - tp.x) / flight, vy, g, rot: 0, spin: (Math.random() - 0.5) * 8, caughtCheck: false });
    toasterKick = 1;
    sfx.pop();
    if (!reduced) shake = Math.max(shake, 3);
  }

  function burst(x, y, color, n) {
    n = reduced ? Math.ceil(n / 3) : n;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 260;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.6 + Math.random() * 0.5, color, size: 3 + Math.random() * 5 });
    }
  }
  function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 1 }); }

  function loseLife(x, why) {
    lives--; combo = 0;
    if (!reduced) shake = 14;
    updateHud();
    popup(x, plateY() - 40, why, "#dc2626");
    if (lives <= 0) gameOver();
  }

  function update(dt) {
    t += dt;
    const lv = level();
    // Plate movement
    if (keys.left) plate.target -= 620 * dt;
    if (keys.right) plate.target += 620 * dt;
    plate.target = Math.max(plateW() / 2, Math.min(W - plateW() / 2, plate.target));
    plate.x += (plate.target - plate.x) * Math.min(1, dt * 18);

    nextLaunch -= dt;
    if (nextLaunch <= 0) {
      launch();
      if (lv > 2.2 && Math.random() < 0.25) setTimeout(() => state === "play" && launch(), 180);
      nextLaunch = Math.max(0.42, 1.35 - lv * 0.24) * (0.75 + Math.random() * 0.5);
    }

    nextSpeech -= dt; speechT -= dt;
    if (nextSpeech <= 0) {
      const pool = LINES.slice(0, Math.min(LINES.length, 4 + Math.floor(t / 6)));
      speech = pool[Math.floor(Math.random() * pool.length)];
      speechT = 2.6; nextSpeech = 5 + Math.random() * 4;
    }
    toasterKick = Math.max(0, toasterKick - dt * 4);
    shake = Math.max(0, shake - dt * 40);

    const py = plateY(), pw = plateW();
    for (const it of items) {
      const prevY = it.y;
      it.vy += it.g * dt;
      it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.spin * dt;
      if (it.x < 20 || it.x > W - 20) { it.vx *= -1; it.x = Math.max(20, Math.min(W - 20, it.x)); }
      // Catch only while falling through the plate line
      if (!it.done && it.vy > 0 && prevY <= py - 8 && it.y >= py - 8 && Math.abs(it.x - plate.x) < pw / 2 + 14) {
        it.done = true;
        const k = KINDS[it.kind];
        if (k.good) {
          combo++;
          const mult = combo >= 10 ? 3 : combo >= 5 ? 2 : 1;
          const pts = k.points * mult;
          score += pts;
          burst(it.x, py, it.kind === "croissant" ? "#f59e0b" : "#d97706", it.kind === "croissant" ? 26 : 12);
          popup(it.x, py - 30, "+" + pts + (mult > 1 ? " TOASTY x" + mult : ""), it.kind === "croissant" ? "#c2410c" : "#2b1d14");
          it.kind === "croissant" ? sfx.bonus() : sfx.catch(Math.min(combo, 12));
          updateHud();
        } else {
          sfx.honk();
          burst(it.x, py, "#7c3aed", 14);
          loseLife(it.x, it.kind === "sock" ? "THAT'S A SOCK." : "WHY WOULD YOU CATCH A DUCK");
        }
      }
      if (!it.done && it.y > H - 12) {
        it.done = true;
        if (KINDS[it.kind].good) {
          sfx.splat();
          burst(it.x, H - 12, "#b45309", 10);
          if (it.kind === "toast") loseLife(it.x, "SPLAT. Toast down.");
          else popup(it.x, H - 60, "the croissant is gone", "#78350f");
        } else {
          popup(it.x, H - 60, "good dodge", "#16a34a");
        }
      }
    }
    items = items.filter(it => !it.done);
    for (const p of particles) { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 50 * dt; p.life -= dt * 0.9; }
    popups = popups.filter(p => p.life > 0);
  }

  /* ---------- Drawing ---------- */
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function drawKitchen() {
    ctx.fillStyle = "#ffe9c7"; ctx.fillRect(0, 0, W, H);
    // Wall tiles
    ctx.strokeStyle = "rgba(43,29,20,.07)"; ctx.lineWidth = 2;
    const s = 46;
    for (let x = 0; x < W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // Ceiling scorch marks grow with level
    const lv = state === "play" ? level() : 1;
    ctx.fillStyle = "rgba(43,29,20," + Math.min(0.25, (lv - 1) * 0.08) + ")";
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse((i + 0.5) * W / 6, 0, 40 + lv * 10, 18 + lv * 6, 0, 0, Math.PI * 2); ctx.fill(); }
    // Counter
    const tp = toasterPos();
    ctx.fillStyle = "#c08457"; ctx.fillRect(0, tp.y + 18, W, H);
    ctx.fillStyle = "#a16207"; ctx.fillRect(0, tp.y + 18, W, 6);
    // Plate guide line
    ctx.setLineDash([6, 10]); ctx.strokeStyle = "rgba(43,29,20,.12)";
    ctx.beginPath(); ctx.moveTo(0, plateY()); ctx.lineTo(W, plateY()); ctx.stroke(); ctx.setLineDash([]);
  }

  function drawToaster() {
    const tp = toasterPos(), lv = state === "play" ? level() : 1;
    const anger = Math.min(1, (lv - 1) / 2.5);
    const w = 150, h = 92 - toasterKick * 8;
    const x = tp.x - w / 2, y = tp.y - h + 18;
    // Steam when angry
    if (anger > 0.3) {
      ctx.fillStyle = "rgba(255,255,255,.7)";
      for (let i = 0; i < 3; i++) {
        const ph = (t * 1.5 + i * 0.33) % 1;
        ctx.beginPath(); ctx.arc(x + 20 + i * 55, y - 8 - ph * 60, 8 + ph * 10, 0, Math.PI * 2); ctx.globalAlpha = 1 - ph; ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    const r = Math.round(200 + anger * 55), g = Math.round(205 - anger * 140), b = Math.round(215 - anger * 160);
    ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.strokeStyle = "#2b1d14"; ctx.lineWidth = 4;
    rr(x, y, w, h, 26); ctx.fill(); ctx.stroke();
    // Slots
    ctx.fillStyle = "#2b1d14";
    rr(x + 28, y + 8, 38, 9, 4); ctx.fill();
    rr(x + w - 66, y + 8, 38, 9, 4); ctx.fill();
    // Lever
    ctx.fillStyle = "#2b1d14"; rr(x + w - 2, y + 34 + toasterKick * 14, 16, 10, 4); ctx.fill();
    // Face
    const eyeY = y + 42, wob = Math.sin(t * 10) * anger * 1.5;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(tp.x - 26, eyeY + wob, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(tp.x + 26, eyeY - wob, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const look = state === "play" ? Math.max(-4, Math.min(4, (plate.x - tp.x) / 60)) : 0;
    ctx.fillStyle = "#2b1d14";
    ctx.beginPath(); ctx.arc(tp.x - 26 + look, eyeY + wob, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(tp.x + 26 + look, eyeY - wob, 5, 0, Math.PI * 2); ctx.fill();
    // Angry brows
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(tp.x - 38, eyeY - 16 + anger * 2); ctx.lineTo(tp.x - 16, eyeY - 14 + anger * 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tp.x + 38, eyeY - 16 + anger * 2); ctx.lineTo(tp.x + 16, eyeY - 14 + anger * 8); ctx.stroke();
    // Mouth: smile turns into a scream
    ctx.beginPath();
    if (anger < 0.4) { ctx.arc(tp.x, eyeY + 14, 12, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
    else { ctx.fillStyle = "#7f1d1d"; ctx.ellipse(tp.x, eyeY + 24, 10 + anger * 6, 5 + anger * 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    // Speech bubble
    if (speechT > 0 && state === "play") {
      ctx.font = "800 " + Math.max(14, Math.min(18, W / 30)) + "px system-ui, sans-serif";
      const text = speech, tw = ctx.measureText(text).width + 28;
      let bx = tp.x + 60, by = y - 70;
      if (bx + tw > W - 10) bx = Math.max(10, W - 10 - tw);
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#2b1d14"; ctx.lineWidth = 3;
      rr(bx, by, tw, 40, 14); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(Math.min(bx + 24, tp.x + 40), by + 40); ctx.lineTo(tp.x + 30, y - 6); ctx.lineTo(Math.min(bx + 44, tp.x + 60), by + 40); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.fillRect(Math.min(bx + 22, tp.x + 38), by + 36, 26, 6);
      ctx.fillStyle = "#2b1d14"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
      ctx.fillText(text, bx + 14, by + 21);
    }
  }

  function drawPlate() {
    const py = plateY(), pw = plateW();
    ctx.fillStyle = "rgba(43,29,20,.15)";
    ctx.beginPath(); ctx.ellipse(plate.x + 5, py + 10, pw / 2, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#2b1d14"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(plate.x, py, pw / 2, 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#93c5fd"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(plate.x, py - 1, pw / 2 - 14, 7, 0, 0, Math.PI * 2); ctx.stroke();
    if (combo >= 5) {
      ctx.font = "900 16px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#c2410c";
      ctx.fillText("COMBO " + combo, plate.x, py + 36);
    }
  }

  function drawItems() {
    const size = Math.max(34, Math.min(52, W / 14));
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = size + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    for (const it of items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      ctx.fillText(KINDS[it.kind].emoji, 0, 0);
      ctx.restore();
    }
  }

  function drawFx() {
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      ctx.font = "900 " + Math.max(16, Math.min(24, W / 24)) + "px system-ui, sans-serif";
      ctx.lineWidth = 5; ctx.strokeStyle = "#fff8ee"; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawKitchen();
    drawToaster();
    if (state === "play") { drawItems(); drawPlate(); drawFx(); }
    ctx.restore();
  }

  /* ---------- HUD and screens ---------- */
  const $score = document.getElementById("score"), $lives = document.getElementById("lives");
  function updateHud() {
    $score.textContent = score;
    $lives.textContent = "🧈".repeat(Math.max(0, lives)) + "▫️".repeat(Math.max(0, 3 - lives));
    $lives.setAttribute("aria-label", lives + " lives left");
  }

  function start() {
    audio();
    reset();
    state = "play";
    document.getElementById("start").hidden = true;
    document.getElementById("over").hidden = true;
  }

  function gameOver() {
    state = "over";
    sfx.over();
    best = Math.max(best, score);
    let rank = RANKS[0][1];
    for (const [min, name] of RANKS) if (score >= min) rank = name;
    document.getElementById("final").textContent = score + (score === 1 ? " point" : " points");
    document.getElementById("rank").textContent = "Rank: " + rank;
    document.getElementById("quip").textContent = QUIPS[Math.floor(Math.random() * QUIPS.length)] + (best > score ? " (Best this session: " + best + ")" : "");
    document.getElementById("overTitle").textContent = score >= 45 ? "The toaster respects you" : "Breakfast is ruined";
    document.getElementById("over").hidden = false;
    setTimeout(() => document.getElementById("again").focus(), 50);
  }

  document.getElementById("play").addEventListener("click", start);
  document.getElementById("again").addEventListener("click", start);

  /* ---------- Controls: mouse, touch, keyboard ---------- */
  function pointTo(clientX) { if (plate) plate.target = clientX; }
  cv.addEventListener("pointermove", (e) => pointTo(e.clientX));
  cv.addEventListener("pointerdown", (e) => { pointTo(e.clientX); audio(); });
  addEventListener("touchmove", (e) => { if (e.touches[0]) pointTo(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keys.left = true; e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keys.right = true; e.preventDefault(); }
    if ((e.key === " " || e.key === "Enter") && state !== "play" && document.activeElement.tagName !== "BUTTON") { start(); e.preventDefault(); }
    if (e.key === "m" || e.key === "M") document.getElementById("mute").click();
  });
  addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });

  /* ---------- Loop ---------- */
  let last = performance.now(), paused = false;
  document.addEventListener("visibilitychange", () => { paused = document.hidden; last = performance.now(); });
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state === "play" && !paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  reset();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
