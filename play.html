<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<title>Play · {name}</title>
<meta name="robots" content="noindex">
</head>
<body data-page="play" class="player">
<a class="skip-link" href="#main">Skip to game</a>
<div class="player-bar">
  <a class="btn btn-small" href="gallery.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Back to gallery</a>
  <div class="player-title" id="player-title"><strong>Loading…</strong></div>
  <div class="player-rating" id="player-rating"></div>
  <div id="player-admin"></div>
  <div class="auth-slot" data-auth="compact"></div>
  <button class="btn btn-small" id="fullscreen" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg> Full screen</button>
</div>
<main id="main" class="player-main"></main>
<script>
  // Always load the latest settings, so edits to config.js show up as soon as GitHub publishes them
  // (browsers would otherwise keep using a saved copy for up to 10 minutes).
  document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');
</script>
<script src="assets/site.js"></script>
</body>
</html>
