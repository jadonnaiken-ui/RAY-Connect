<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NOODLE · a snake game, but deeply unwell</title>
<style>
  :root {
    --ink: #2b1d3a; --pink: #ff8fc7; --mint: #7ee8c4; --sun: #ffd25e; --sky: #8fd3ff; --lilac: #c9a7ff; --cream: #fff8ec;
    --stage: min(92vw, calc(100vh - 330px), 540px);
  }
  @media (hover: hover) and (pointer: fine) { :root { --stage: min(92vw, calc(100vh - 210px), 560px); } .pad { display: none !important; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(120deg, #ffd6ec, #d9f0ff, #e3ffe9, #fff1c9, #ecd9ff);
    background-size: 400% 400%;
    animation: bgshift 18s ease-in-out infinite;
  }
  @keyframes bgshift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  #bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #bg span { position: absolute; font-size: 34px; opacity: .22; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateY(110vh) rotate(0deg); } to { transform: translateY(-20vh) rotate(360deg); } }

  main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px; }
  header { text-align: center; line-height: 1; }
  h1 { margin: 0; font-size: clamp(38px, 9vw, 60px); font-weight: 900; letter-spacing: 2px; }
  h1 span { display: inline-block; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); animation: wave 1.6s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
  .sub { font-weight: 800; font-size: 14px; opacity: .75; margin-top: 6px; letter-spacing: .5px; }

  .hud { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .pill { background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 var(--ink); display: flex; align-items: center; gap: 6px; font-family: inherit; color: var(--ink); }
  .pill b { display: inline-block; min-width: 1.2em; text-align: center; }
  .pill b.bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(1.7) rotate(-8deg); color: #e0377f; } }
  button.pill { cursor: pointer; padding: 4px 10px; }
  button.pill:active, .btn:active, .pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  .stage { position: relative; width: var(--stage); height: var(--stage); min-width: 240px; min-height: 240px; }
  canvas { width: 100%; height: 100%; display: block; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); background: var(--cream); }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: rgba(43,29,58,.38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 5; }
  .overlay.hidden { display: none; }
  .card { background: var(--cream); border: 4px solid var(--ink); border-radius: 20px; box-shadow: 0 7px 0 var(--ink); padding: 14px 16px; width: 88%; max-height: 92%; overflow: auto; text-align: center; animation: popin .45s cubic-bezier(.2,1.6,.4,1); touch-action: pan-y; }
  @keyframes popin { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
  .card h2 { margin: 2px 0; font-size: 15px; font-weight: 800; opacity: .7; }
  .big { font-size: 46px; line-height: 1.1; animation: wave 1.2s ease-in-out infinite; display: inline-block; }
  .name { font-size: clamp(18px, 4.6vw, 24px); font-weight: 900; margin: 2px 0 10px; color: #d6337a; }
  .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 6px 0 12px; }
  .legend div { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 4px 2px; font-size: 11px; font-weight: 800; line-height: 1.15; }
  .legend div span { display: block; font-size: 20px; }
  .btn { font: 900 18px/1 inherit; font-family: inherit; color: var(--ink); background: var(--pink); border: 3px solid var(--ink); border-radius: 14px; padding: 11px 20px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; }
  .btn:hover { filter: brightness(1.06); }
  .small { font-size: 12px; font-weight: 700; opacity: .6; margin-top: 8px; }
  .grave { font-size: 44px; line-height: 1; }
  .rip { font-size: 13px; font-weight: 800; opacity: .6; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
  .obit { font-size: 14px; font-weight: 700; margin: 6px 0; line-height: 1.35; }
  .eats { font-size: 16px; margin: 6px 0; word-break: break-word; }
  .epitaph { font-style: italic; font-size: 13px; opacity: .8; margin: 6px 0 10px; }
  .scores { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  .record { display: inline-block; background: var(--sun); border: 3px solid var(--ink); border-radius: 999px; padding: 3px 12px; font-weight: 900; font-size: 13px; transform: rotate(-4deg); animation: wave 1s infinite; margin-bottom: 8px; }

  #fx { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; z-index: 3; }
  .fxpill { position: relative; overflow: hidden; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-weight: 900; font-size: 12px; animation: popin .35s cubic-bezier(.2,1.6,.4,1); }
  .fxpill i { position: absolute; left: 0; bottom: 0; height: 3px; background: #e0377f; }
  #toasts { position: absolute; left: 0; right: 0; top: -14px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 6; }
  .toast { background: var(--sun); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); padding: 6px 12px; font-weight: 900; font-size: 14px; animation: toast 2.8s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes toast { 0% { transform: translateY(-30px) scale(.5); opacity: 0; } 12% { transform: none; opacity: 1; } 85% { transform: none; opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }

  .hint { font-size: 12px; font-weight: 800; opacity: .55; }
  @media (hover: none), (pointer: coarse) { .hint { display: none; } }
  .pad { display: grid; grid-template-columns: repeat(3, 62px); gap: 7px; }
  .pad button { height: 52px; font-size: 22px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); color: var(--ink); padding: 0; touch-action: none; }
  .pad .blank { visibility: hidden; }
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <header>
    <h1 id="logo"></h1>
    <div class="sub">a snake game, but deeply unwell</div>
  </header>
  <div class="hud">
    <div class="pill" title="Score">🍽️ <b id="score">0</b></div>
    <div class="pill" title="Best">🏆 <b id="best">0</b></div>
    <div class="pill" title="Length">📏 <b id="len">4</b></div>
    <button class="pill" id="pauseBtn" type="button" aria-label="Pause">⏸️</button>
    <button class="pill" id="muteBtn" type="button" aria-label="Mute">🔊</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="fx"></div>
    <div id="toasts"></div>
    <div class="overlay" id="titleOv">
      <div class="card">
        <div class="big">🍝</div>
        <h2>Today, your noodle is</h2>
        <div class="name" id="titleName"></div>
        <div class="legend" id="legend"></div>
        <button class="btn" id="startBtn" type="button">LET'S NOODLE 🐍</button>
        <div class="small">or press any arrow key · swipe · tap</div>
      </div>
    </div>
    <div class="overlay hidden" id="deadOv"><div class="card" id="deadCard"></div></div>
  </div>
  <div class="hint">arrows / WASD to steer · P to pause · M to mute</div>
  <div class="pad">
    <button class="blank" tabindex="-1" type="button"></button><button data-d="up" type="button" aria-label="Up">⬆️</button><button class="blank" tabindex="-1" type="button"></button>
    <button data-d="left" type="button" aria-label="Left">⬅️</button><button data-d="down" type="button" aria-label="Down">⬇️</button><button data-d="right" type="button" aria-label="Right">➡️</button>
  </div>
</main>

<script>
"use strict";
/* ================= constants ================= */
const N = 20, S = 20, W = N * S;
const INK = "#2b1d3a";
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: "down", down: "up", left: "right", right: "left" };
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };

const GENERIC = ["nom", "delicious", "mmmyes", "*crunch*", "more.", "chomp chomp", "I am unstoppable", "snack acquired", "yummers", "10/10 would eat again"];
const FOODS = [
  { e: "🍕", w: 6, pts: 1, desc: "just pizza", lines: ["pizza is a vegetable", "I have consumed the triangle", "cheesy."] },
  { e: "🍩", w: 5, pts: 1, desc: "just donut", lines: ["donut? do NOT stop me", "mmm, edible hole", "ring of destiny"] },
  { e: "🧦", w: 3, pts: 2, fx: "reverse", dur: 5000, label: "SOCK BRAIN", desc: "controls go backwards", lines: ["why did I eat a sock", "tastes like Tuesday", "my brain is inside out"] },
  { e: "🌶️", w: 3, pts: 2, fx: "fast", dur: 5000, label: "SPICY ZOOM", desc: "zoom zoom", lines: ["HOT HOT HOT", "my tongue is a volcano", "AAAAAAAAAA"] },
  { e: "🍄", w: 2, pts: 3, fx: "trippy", dur: 6000, label: "WOBBLEVISION", desc: "reality wobbles", lines: ["I can taste colours", "the walls are breathing", "who am I. noodle."] },
  { e: "🦆", w: 3, pts: 3, fx: "duck", dur: 6000, grow: 3, label: "DUCK MODE", desc: "runs away · +3 length", waddle: true, lines: ["QUACK", "I am the duck now", "he was my friend"] },
  { e: "🥒", w: 3, pts: 2, fx: "tiny", dur: 6000, label: "PICKLED", desc: "you get smol", lines: ["I'm smol now", "pickle'd", "briny..."] },
  { e: "🐌", w: 2, pts: 1, fx: "slow", dur: 5000, label: "SLOOOW MO", desc: "bullet time", lines: ["sloooooow", "eeeeaaaaaat", "time is fake"] },
  { e: "🌟", w: 1, pts: 10, fx: "gold", dur: 5000, label: "GOLDEN NOODLE", desc: "rare! escapes fast", expires: 6500, lines: ["I AM ASCENDED", "shiny!!!", "worth it"] },
];
const HATS = [[8, "🧢", "Lil cap unlocked"], [15, "🎩", "Fancy hat unlocked"], [25, "👑", "You are royalty now"], [40, "🪩", "DISCO NOODLE?!"]];
const TITLES = ["Sir", "Lady", "Professor", "Baron", "Little", "Big", "Captain", "Dame", "Lord", "DJ", "Grandma", "Detective", "Chef", "Saint"];
const NAMES = ["Noodles", "Wigglebottom", "Spaghettina", "Slinky", "Linguini", "Hissbert", "Gerald", "Ramen", "Sssteve", "Udon", "Fusilli", "Doug", "Penne", "Squigglesworth"];
const SUFFIX = ["the Unwashed", "III", "of the Floor", "Esq.", "the Moist", "the Hungry", "Jr.", "the Magnificent", "PhD", "the Long", "the Slightly Damp", "of Nowhere"];
const CAUSES = {
  wall: ["Bonked a wall at full speed.", "Tried to leave the box. The box said no.", "Wall: 1, Noodle: 0.", "Thought the wall was a door."],
  self: ["Ate own tail. Mistook it for spaghetti.", "Became an ouroboros. Prematurely.", "Tied themself in a knot.", "Bit themself. Rude."],
};
const EPITAPHS = [
  "They died as they lived: moving forward with total confidence.",
  "Gone, but not forgotten. Well, mostly forgotten.",
  "Should've turned left.",
  "Now a noodle in the great colander in the sky.",
  "Survived by one (1) half-eaten sock.",
  "In lieu of flowers, please send garlic bread.",
  "Their last words were \"hiss\".",
  "Al dente to the very end.",
];

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => performance.now();
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const makeName = () => `${pick(TITLES)} ${pick(NAMES)} ${pick(SUFFIX)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ================= audio ================= */
let AC = null, master, sfx, mus, muted = localStorage.getItem("noodle-muted") === "1";
let nextNoteTime = 0, noteStep = 0;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.connect(AC.destination);
      sfx = AC.createGain(); sfx.gain.value = 0.5; sfx.connect(master);
      mus = AC.createGain(); mus.gain.value = 0.14; mus.connect(master);
      applyMute();
      setInterval(scheduler, 25);
    }
    if (AC.state === "suspended") AC.resume();
  } catch (e) { /* no audio, no problem */ }
}
function applyMute() {
  if (master) master.gain.value = muted ? 0 : 1;
  $("muteBtn").textContent = muted ? "🔇" : "🔊";
}
function tone(f, d, o = {}) {
  if (!AC) return;
  const t0 = (o.at != null ? o.at : AC.currentTime) + (o.delay || 0);
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || "square";
  osc.frequency.setValueAtTime(f, t0);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + d);
  const v = o.vol != null ? o.vol : 0.3;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + (o.atk || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  if (o.bp) {
    const bq = AC.createBiquadFilter(); bq.type = "bandpass"; bq.frequency.value = o.bp; bq.Q.value = o.q || 3;
    osc.connect(bq); bq.connect(g);
  } else osc.connect(g);
  g.connect(o.dest || sfx);
  if (o.vib) {
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = o.vib; lg.gain.value = o.vibAmt || f * 0.03;
    l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + d + 0.05);
  }
  osc.start(t0); osc.stop(t0 + d + 0.05);
}
function noise(d, vol, freq, o = {}) {
  if (!AC) return;
  const t0 = (o.at != null ? o.at : AC.currentTime) + (o.delay || 0);
  const len = Math.max(1, Math.floor(AC.sampleRate * d));
  const buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = o.type || "lowpass"; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  src.connect(f); f.connect(g); g.connect(o.dest || sfx); src.start(t0); src.stop(t0 + d);
}
const SFX = {
  eat(c) { const b = 330 * Math.pow(2, Math.min(c - 1, 14) / 12); tone(b, .08, { vol: .16 }); tone(b * 1.5, .14, { vol: .16, delay: .06, slide: b * 2.2 }); },
  quack() { [0, .17].forEach(d => tone(560, .14, { type: "sawtooth", slide: 300, bp: 1100, q: 4, vol: .7, delay: d })); },
  boing() { tone(140, .5, { type: "sine", slide: 620, vib: 18, vibAmt: 70, vol: .45 }); },
  whistleUp() { tone(420, .5, { type: "sine", slide: 1700, vib: 7, vibAmt: 25, vol: .3 }); },
  whistleDown() { tone(1500, .8, { type: "sine", slide: 260, vib: 6, vibAmt: 25, vol: .3 }); },
  trippy() { tone(300, .9, { type: "triangle", vib: 3, vibAmt: 80, vol: .3 }); tone(452, .9, { type: "triangle", vib: 4.5, vibAmt: 90, vol: .2 }); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .45 : .12, { vol: .15, delay: i * .09 })); },
  tiny() { [1400, 1800, 2200].forEach((f, i) => tone(f, .06, { type: "triangle", vol: .2, delay: i * .05 })); },
  bonk() { noise(.18, .9, 500); tone(110, .25, { type: "sine", slide: 40, vol: .6 }); },
  sad() { [392, 370, 349, 330].forEach((f, i) => tone(f, i === 3 ? 1.1 : .36, { type: "sawtooth", bp: 800, q: 1, vol: .5, delay: .35 + i * .38, vib: i === 3 ? 5.5 : 0, vibAmt: 9 })); },
  pop(i) { tone(260 + i * 22, .06, { type: "triangle", vol: .14 }); },
  ding() { tone(1320, .15, { type: "triangle", vol: .25 }); tone(1760, .3, { type: "triangle", vol: .25, delay: .08 }); },
  escape() { tone(900, .3, { type: "square", slide: 2400, vol: .1 }); },
};
/* bouncy little loop: C - Am - F - G */
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
const BASS = [48, 45, 41, 43];
const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
const MEL = [72, null, 76, 79, null, 76, 74, null, 72, null, 69, 72, null, null, null, null,
             69, null, 72, 77, null, 76, 74, 72, 74, null, 71, 67, null, 71, 74, null];
function scheduler() {
  if (!AC || phase !== "play" || paused) { if (AC) nextNoteTime = AC.currentTime + 0.06; return; }
  if (nextNoteTime < AC.currentTime) nextNoteTime = AC.currentTime + 0.03;
  let bpm = 140, pitch = 1;
  if (effects.fast) { bpm *= 1.45; pitch = 1.12; }
  if (effects.slow) { bpm *= 0.55; pitch = 0.75; }
  const stepLen = 60 / bpm / 2;
  while (nextNoteTime < AC.currentTime + 0.12) {
    const s = noteStep % 32, bar = Math.floor(s / 8), b = s % 8, at = nextNoteTime, o = { at, dest: mus };
    if (b === 0 || b === 4) tone(midi(BASS[bar] + (b === 4 ? 7 : 0)) * pitch, stepLen * 1.6, { ...o, type: "triangle", vol: .9 });
    if (b === 2 || b === 6) CHORDS[bar].forEach(n => tone(midi(n) * pitch, stepLen * .7, { ...o, type: "square", vol: .12 }));
    if (b % 2 === 1) noise(.03, .25, 7000, { at, dest: mus, type: "highpass" });
    if (MEL[s]) tone(midi(MEL[s]) * pitch, stepLen * 1.3, { ...o, type: "square", vol: .22, vib: effects.trippy ? 6 : 0, vibAmt: 30 });
    nextNoteTime += stepLen; noteStep++;
  }
}

/* ================= state ================= */
const cv = $("c"), ctx = cv.getContext("2d");
let dpr = 1;
function resize() { dpr = Math.min(3, window.devicePixelRatio || 1) * 1.5; cv.width = W * dpr; cv.height = W * dpr; }
resize(); addEventListener("resize", resize);

let phase = "title", paused = false, pausedAt = 0;
let snake = [], prev = [], dir = [1, 0], queue = [], food = null, grow = 0;
let score = 0, best = +localStorage.getItem("noodle-best") || 0, combo = 0, lastEat = -1e9, totalEats = 0;
let effects = {}, particles = [], floaters = [], bubble = null, shake = 0, eaten = {};
let noodleName = makeName(), nextName = "", hatLevel = 0, startAt = 0, deathAt = 0, deathCause = "", deadShownAt = 0, popped = 0;
let tickAcc = 0, lastT = now();
const achieved = new Set();
const eye = { x: 0, y: 0, vx: 0, vy: 0 };
let nextBlink = 2000, nextTongue = 1500, chompAt = -1e9;

function idleSnake() { snake = [[9, 10], [8, 10], [7, 10], [6, 10]]; prev = snake.map(p => p.slice()); dir = [1, 0]; }
idleSnake();

/* ================= game flow ================= */
function start() {
  initAudio();
  if (nextName) noodleName = nextName;
  idleSnake();
  queue = []; score = 0; combo = 0; effects = {}; grow = 0; particles = []; floaters = []; eaten = {}; totalEats = 0; hatLevel = 0;
  bubble = null; paused = false; tickAcc = 0; lastEat = -1e9; startAt = now();
  placeFood();
  phase = "play";
  $("titleOv").classList.add("hidden"); $("deadOv").classList.add("hidden");
  updateHUD();
  say(pick(["let's noodle", "I'm hungry", "hello world (I will eat it)", "*hiss* (affectionate)", "I was born 1 second ago"]));
}

function placeFood() {
  const free = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!snake.some(p => p[0] === x && p[1] === y)) free.push([x, y]);
  if (!free.length) { food = null; return; }
  const c = pick(free);
  let kind;
  if (totalEats < 2) kind = FOODS[Math.random() < .5 ? 0 : 1];
  else {
    const tot = FOODS.reduce((a, f) => a + f.w, 0); let r = Math.random() * tot;
    kind = FOODS.find(f => (r -= f.w) < 0) || FOODS[0];
  }
  food = { x: c[0], y: c[1], fx: c[0], fy: c[1], kind, born: now(), hopAt: -1e9, nextHop: now() + 900 };
}

function stepMs() {
  let m = Math.max(66, 135 - (snake.length - 4) * 2.2);
  if (effects.fast) m *= 0.58;
  if (effects.slow) m *= 1.9;
  return m;
}

function turn(name) {
  if (paused) togglePause();
  if (effects.reverse) name = OPP[name];

  ctx.fillStyle = "#fff"; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
  rr(-w / 2, -h / 2, w, h, 11); ctx.fill(); ctx.stroke();
  const tx = clamp(hx - bx, -w / 2 + 12, w / 2 - 12), ty = below ? -h / 2 : h / 2, dy = below ? -8 : 8;
  ctx.beginPath(); ctx.moveTo(tx - 6, ty); ctx.lineTo(tx, ty + dy); ctx.lineTo(tx + 6, ty); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 6, ty); ctx.lineTo(tx, ty + dy); ctx.lineTo(tx + 6, ty); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.fillRect(tx - 5, ty - (below ? -1.5 : 1.5) - 1, 10, 2.5);
  ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(bubble.text, 0, 1);
  ctx.restore();
}

/* ================= main loop ================= */
function frame(t) {
  const dt = Math.min(100, t - lastT); lastT = t;
  let alpha = 1;
  if (phase === "play" && !paused) {
    tickAcc += dt;
    let ms = stepMs();
    while (tickAcc >= ms && phase === "play") { tickAcc -= ms; step(t); ms = stepMs(); }
    for (const k in effects) if (effects[k].until < t) {
      delete effects[k];
      if (k === "reverse") say("my brain is back");
      if (k === "tiny") say("big again");
    }
    if (food && food.kind.waddle && t > food.nextHop) {
      const opts = Object.values(DIRS).map(d => [food.x + d[0], food.y + d[1]])
        .filter(c => c[0] >= 0 && c[1] >= 0 && c[0] < N && c[1] < N && !snake.some(p => p[0] === c[0] && p[1] === c[1]));
      if (opts.length) { const c = pick(opts); food.fx = food.x; food.fy = food.y; food.x = c[0]; food.y = c[1]; food.hopAt = t; }
      food.nextHop = t + rand(500, 900);
    }
    if (food && food.kind.expires && t - food.born > food.kind.expires) {
      floaters.push({ x: food.x * S + S / 2, y: food.y * S, text: "it got away!", t0: t, color: "#ffd25e", size: 14 });
      SFX.escape(); placeFood();
    }
    if (phase === "play") alpha = clamp(tickAcc / stepMs(), 0, 1);
  }
  if (phase === "dying") dyingUpdate(t);
  if (phase === "title") { // idle wiggle on the title screen
    dir = [1, 0];
  }
  const k = dt / 16;
  particles.forEach(p => { p.life += dt; p.x += p.vx * k; p.y += p.vy * k; p.vy += .12 * k; p.vx *= .99; p.rot += p.vr * k; });
  particles = particles.filter(p => p.life < p.max);
  floaters = floaters.filter(f => t - f.t0 < 900);
  updateFx(t);
  draw(t, alpha);
  requestAnimationFrame(frame);
}

/* ================= input ================= */
function primary() {
  initAudio();
  if (phase === "title") start();
  else if (phase === "dead" && now() - deadShownAt > 700) start();
}
addEventListener("keydown", e => {
  initAudio();
  const k = e.key, d = KEYS[k] || KEYS[k.toLowerCase()];
  if (k === "m" || k === "M") { toggleMute(); return; }
  if (phase === "title" || phase === "dead") {
    if (d || k === " " || k === "Enter") { e.preventDefault(); primary(); }
    return;
  }
  if (phase === "play") {
    if (k === "p" || k === "P" || k === "Escape" || k === " ") { e.preventDefault(); togglePause(); return; }
    if (d) { e.preventDefault(); turn(d); }
  }
});
document.querySelectorAll("[data-d]").forEach(b => b.addEventListener("pointerdown", e => {
  e.preventDefault(); initAudio();
  if (phase === "play") turn(b.dataset.d); else primary();
}));
let tsx = null, tsy = 0;
addEventListener("touchstart", e => {
  if (e.target.closest("button, .card")) { tsx = null; return; }
  tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
}, { passive: true });
addEventListener("touchend", e => {
  if (tsx === null) return;
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  tsx = null; initAudio();
  if (phase !== "play") { primary(); return; }
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
$("startBtn").addEventListener("click", start);
$("pauseBtn").addEventListener("click", () => { initAudio(); togglePause(); });
function toggleMute() { muted = !muted; localStorage.setItem("noodle-muted", muted ? "1" : "0"); applyMute(); }
$("muteBtn").addEventListener("click", () => { initAudio(); toggleMute(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && phase === "play" && !paused) togglePause(); });

/* ================= boot ================= */
$("logo").innerHTML = "NOODLE".split("").map((c, i) =>
  `<span style="color:${["#ff8fc7", "#ffd25e", "#7ee8c4", "#8fd3ff", "#c9a7ff", "#ff8fc7"][i]};animation-delay:${i * .12}s">${c}</span>`).join("");
$("titleName").textContent = noodleName;
$("legend").innerHTML = FOODS.map(f => `<div><span>${f.e}</span>${f.desc}</div>`).join("");
$("bg").innerHTML = Array.from({ length: 16 }, () =>
  `<span style="left:${rand(0, 95)}vw;animation-duration:${rand(16, 32)}s;animation-delay:-${rand(0, 30)}s">${pick(FOODS).e}</span>`).join("");
applyMute();
updateHUD();
requestAnimationFrame(t => { lastT = t; frame(t); });
</script>
