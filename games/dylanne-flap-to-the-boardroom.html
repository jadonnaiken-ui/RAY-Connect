<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flap to the Boardroom</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1b1020;color:#fff;
  font-family:Trebuchet MS,Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;}
#c{display:block;width:100%;height:100%;touch-action:none;}
#toggles{position:absolute;top:5px;right:5px;display:flex;gap:4px;z-index:5;}
#toggles button{background:#2a1810;color:#ffe9b8;border:2px solid #7a5a38;border-radius:9px;font-weight:800;
  font-size:11px;padding:6px 8px;min-width:48px;cursor:pointer;font-family:inherit;}
#toggles button.on{background:#2f6a2a;border-color:#8cdb5a;color:#fff;}
#toggles button.off{background:#6a2424;border-color:#e66;color:#fdd;}
#howto{position:absolute;left:10px;right:10px;bottom:6px;background:rgba(20,10,30,.55);border-radius:10px;padding:4px 8px;text-align:center;font-weight:800;font-size:13px;
  color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;line-height:1.25;z-index:4;}
#overlay{display:none;position:absolute;inset:0;background:transparent;pointer-events:none;align-items:flex-start;justify-content:center;padding-top:112px;box-sizing:border-box;z-index:8;}
#overlay.show{display:flex;}
#ovcard{background:#fff4dc;color:#1a120c;border:6px solid #1a120c;border-radius:20px;padding:12px 16px;pointer-events:auto;
  text-align:center;width:min(86vw,380px);box-sizing:border-box;}
#ovcard h1{margin:0 0 6px;font-size:clamp(22px,6vw,30px);line-height:1.1;}
#ovcard p{white-space:pre-line;margin:0 0 6px;font-weight:700;font-size:clamp(14px,3.8vw,17px);line-height:1.25;}
#ovcard p.stats{font-size:11px;opacity:.7;margin:0 0 6px;}
@media (max-height:519px){#overlay{align-items:center;justify-content:flex-end;padding:0 10px 0 0;}#ovcard{width:290px;}}
#ovcard button{background:#c43030;color:#fff;border:4px solid #1a120c;border-radius:14px;font-weight:900;
  font-size:16px;padding:8px 16px;margin:3px;cursor:pointer;font-family:inherit;}
#ovcard button.alt{background:#2a7ad0;}

</style></head>
<body>
<div id="stage">
  <canvas id="c" width="390" height="844"></canvas>
  <div id="toggles">
    <button id="btnMus" class="on" type="button">MUSIC</button>
    <button id="btnSfx" class="on" type="button">SFX</button>
    <button id="btnMute" class="off" type="button">MUTE</button>
  </div>
  <div id="howto">Tap or click to flap through the office and get the boss's coffee to the boardroom!</div>
  <div id="overlay"><div id="ovcard"></div></div>
</div>

<script>
(function () {
"use strict";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const $ = (id) => document.getElementById(id);
let W = 296, H = 640, PORT = true;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rr(c, x, y, w, h, r) {
  const rad = Math.min(r || 8, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}
function oval(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function fillStroke(c, fill, stroke, lw) {
  c.fillStyle = fill; c.fill();
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 3; c.stroke(); }
}
function mix(a, b, t) { // hex colour blend
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t)), g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t)), bl = Math.round(lerp(pa & 255, pb & 255, t));
  return "rgb(" + r + "," + g + "," + bl + ")";
}
function resize() {
  const w = window.innerWidth || 390, h = window.innerHeight || 844;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  PORT = h > w;
  H = h < 520 ? 520 : 640; W = H * w / h;
}
window.addEventListener("resize", resize);
resize();

const G = {
  state: "intro", who: "f", confetti: null, sfxCount: { pfft: 0, yelp: 0 }, sfxLog: [], logOn: false, t: 0, parts: [], musOn: true, sfxOn: true, muted: false,
  perf: { last: 0, fps: 60, samples: [], p95: 16.7 }
};
const player = { hopT: 0 };

/* ---------------- Web Audio only (no samples, no network) ---------------- */
let AC = null, master = null, musGain = null, sfxGain = null;
let musTimer = 0, musStep = 0;
function ensureAC() {
  if (AC) return AC;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 1; master.connect(AC.destination);
  musGain = AC.createGain(); musGain.gain.value = 0.15; musGain.connect(master);
  sfxGain = AC.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(master);
  return AC;
}
function unlockAudio() { try { ensureAC(); if (AC && AC.state === "suspended") AC.resume(); } catch (e) {} }
["pointerdown", "touchstart", "mousedown"].forEach((ev) => window.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
function applyMute() {
  if (musGain) musGain.gain.value = (!G.muted && G.musOn) ? 0.15 : 0;
  if (sfxGain) sfxGain.gain.value = (!G.muted && G.sfxOn) ? 0.55 : 0;
  const m = $("btnMus"), s = $("btnSfx"), u = $("btnMute");
  m.className = G.musOn && !G.muted ? "on" : "off"; m.textContent = G.musOn && !G.muted ? "MUSIC" : "MUSIC OFF";
  s.className = G.sfxOn && !G.muted ? "on" : "off"; s.textContent = G.sfxOn && !G.muted ? "SFX" : "SFX OFF";
  u.className = G.muted ? "on" : "off"; u.textContent = G.muted ? "MUTED" : "MUTE";
}
$("btnMus").onclick = () => { unlockAudio(); G.musOn = !G.musOn; applyMute(); };
$("btnSfx").onclick = () => { unlockAudio(); G.sfxOn = !G.sfxOn; applyMute(); };
$("btnMute").onclick = () => { unlockAudio(); G.muted = !G.muted; applyMute(); };

function beep(freq, dur, type, vol, slide, delay) {
  if (!AC || G.muted || !G.sfxOn) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, from, to, delay) {
  if (!AC || G.muted || !G.sfxOn) return;
  const t0 = AC.currentTime + (delay || 0);
  const n = AC.createBuffer(1, Math.max(1, Math.floor(AC.sampleRate * dur)), AC.sampleRate);
  const d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = n;
  const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(from || 1200, t0);
  if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol || 0.3, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(sfxGain);
  src.start(t0); src.stop(t0 + dur + 0.03);
}
function sfx(name, a) {
  if (G.logOn) G.sfxLog.push(name + (P && P.phase === "dead" ? "@" + P.deadT.toFixed(2) : P && P.phase === "won" ? "@" + P.winT.toFixed(2) : ""));
  unlockAudio();
  if (!AC || G.muted || !G.sfxOn) return;
  switch (name) {
    case "ding": beep(1318, 0.35, "sine", 0.2); beep(1976, 0.5, "sine", 0.12, 0, 0.07); break;
    case "boing": beep(220, 0.3, "sine", 0.2, 520); beep(520, 0.25, "triangle", 0.12, 180, 0.12); break;
    case "splat": noise(0.2, 0.45, 600, 140); beep(90, 0.18, "sine", 0.25); break;
    case "tick": beep(900, 0.04, "square", 0.08); break;
    case "bark": beep(420, 0.1, "square", 0.2, 220); beep(380, 0.12, "square", 0.18, 200, 0.16); break;
    case "foam": noise(0.7, 0.4, 3000, 400); beep(120, 0.5, "sawtooth", 0.14, 50); break;
    case "alarm": for (let i = 0; i < 5; i++) { beep(880, 0.12, "square", 0.13, 0, i * 0.22); beep(660, 0.12, "square", 0.1, 0, i * 0.22 + 0.11); } break;
    case "fanfare": [523, 659, 784, 1046].forEach((n, i) => beep(n, 0.16, "square", 0.14, 0, i * 0.09)); break;
    case "scratch": noise(0.3, 0.38, 2200, 180); beep(400, 0.22, "sawtooth", 0.12, 80); break;
    case "cricket": for (let i = 0; i < 6; i++) beep(4200, 0.04, "square", 0.05, 0, i * 0.16 + 1.2); break;
    case "choir": [262, 330, 392, 524].forEach((n) => { beep(n, 1.0, "triangle", 0.09); beep(n * 1.006, 1.0, "sine", 0.07); }); break;
    case "horn": beep(700, 0.35, "sawtooth", 0.14, 900); noise(0.3, 0.14, 2000, 800); break;
    case "noseblow": beep(180, 0.12, "sawtooth", 0.16); beep(140, 0.28, "sawtooth", 0.18, 80, 0.08); break;
    case "growl": beep(70, 0.5, "sawtooth", 0.2, 45); beep(75, 0.5, "square", 0.1, 50); break;
    case "click": beep(700, 0.04, "square", 0.08); break;
    case "go": beep(523, 0.1, "square", 0.14); beep(784, 0.2, "square", 0.14, 0, 0.1); break;
    case "whistle": beep(420, 0.22, "triangle", 0.15, 1600); break;
    case "cheer": noise(0.5, 0.2, 1800, 3000); break;
    case "whoop": beep(300, 0.4, "sine", 0.16, 1100); break;
    case "pass": beep(988, 0.12, "sine", 0.17); beep(1318, 0.2, "sine", 0.15, 0, 0.07); break;
    case "pass2": beep(1175, 0.12, "sine", 0.17); beep(1568, 0.22, "sine", 0.15, 0, 0.07); beep(2093, 0.25, "sine", 0.1, 0, 0.14); break;
    case "squeal": for (let i = 0; i < 6; i++) beep(2600 + (i % 2) * 300, 0.09, "sine", 0.07, 0, i * 0.08); break;
    case "slurp": beep(300, 0.35, "sine", 0.14, 900); noise(0.3, 0.12, 1500, 700); break;
    case "staple": beep(1568, 0.1, "square", 0.14); beep(2093, 0.1, "square", 0.14, 0, 0.08); beep(2637, 0.3, "square", 0.14, 0, 0.16); break;
    case "paper": noise(0.25, 0.18, 4000, 1500); break;
    case "door": beep(150, 0.5, "sawtooth", 0.12, 90); beep(440, 0.3, "triangle", 0.12, 0, 0.35); break;
    default: sfx2(name, a); break;
    case "partyhorn": beep(500, 0.5, "sawtooth", 0.14, 1000); noise(0.3, 0.2, 3000, 1500, 0.1); break;
  }
}
/* every tap: sputtery jetpack PFFT + tiny coffee splash (short, pitch-randomised) */
let lastPfft = -1;
function tapSfx() {
  G.sfxCount.pfft++;
  unlockAudio();
  if (!AC || G.muted || !G.sfxOn) return;
  if (AC.currentTime - lastPfft < 0.045) return; // rapid-tap guard keeps it from getting noisy
  lastPfft = AC.currentTime;
  const v = 0.88 + Math.random() * 0.28;
  // sputter: 3 quick raspy puffs with falling pitch, plus a breathy noise burst
  for (let i = 0; i < 3; i++) beep((150 - i * 22) * v, 0.045, "sawtooth", 0.1 - i * 0.02, (90 - i * 12) * v, i * 0.035);
  noise(0.1, 0.2, 2400 * v, 700, 0);
  // small coffee splash: bright noise blip + a tiny "bloop"
  noise(0.09, 0.1, 3600 * v, 1700, 0.07);
  beep(820 * v, 0.07, "sine", 0.07, 420 * v, 0.08);
}
/* occasional babble: squeaky, high, fast gibberish syllables with pitch wobble + quick vowel glides.
   Female EA a bit higher, male EA a bit lower (still squeaky). */
const VOICE = { f: "f", m: "m" };
const VOWELS = [[800, 1400], [420, 2300], [560, 1000], [330, 2500], [700, 1900]];
function yelpSfx(who, text) {
  G.sfxCount.yelp++; if (G.logOn) G.sfxLog.push("yelp" + (P && P.phase === "dead" ? "@" + P.deadT.toFixed(2) : P && P.phase === "won" ? "@" + P.winT.toFixed(2) : ""));
  unlockAudio();
  if (!AC || G.muted || !G.sfxOn) return;
  const fem = VOICE[who] === "f", words = String(text || "WHOA!").split(/\s+/).length;
  const n = Math.min(7, Math.max(3, Math.round(words * 1.4) + 1));
  const base = (fem ? 640 : 470) * (0.94 + Math.random() * 0.12);
  let t = AC.currentTime + 0.02;
  for (let i = 0; i < n; i++) {
    const dur = 0.055 + Math.random() * 0.035, f0 = base * (0.85 + Math.random() * 0.45), f1 = f0 * (0.8 + Math.random() * 0.75);
    const v1 = VOWELS[Math.floor(Math.random() * VOWELS.length)], v2 = VOWELS[Math.floor(Math.random() * VOWELS.length)], sq = 1.25;
    const o = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(120, f1), t + dur);
    lfo.frequency.value = 26 + Math.random() * 14; lg.gain.value = f0 * 0.07; lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.17, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    [0, 1].forEach((k) => {
      const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 5;
      f.frequency.setValueAtTime(v1[k] * sq, t); f.frequency.linearRampToValueAtTime(v2[k] * sq, t + dur);
      o.connect(f); f.connect(g);
    });
    g.connect(sfxGain);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
    t += dur + 0.012 + Math.random() * 0.02;
  }
}
/* upbeat chiptune: C - G - Am - F, speeds up near the end */
const CHORDS = [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]];
const LEAD = [0, 2, 1, 2, 0, 2, 1, 2];
const BASS = [0, 7, 9, 5];
function musTick(bpm) {
  if (!AC || G.muted || !G.musOn) return;
  const now = AC.currentTime, stepDur = 60 / bpm / 2;
  const step = musStep++, bar = Math.floor(step / 8) % 4, k = step % 8;
  const ch = CHORDS[bar], root = 261.63;
  const note = (semi, type, vol, dur, oct) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = root * Math.pow(2, (semi + (oct || 0) * 12) / 12);
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(musGain); o.start(now); o.stop(now + dur + 0.02);
  };
  note(ch[LEAD[k]] + (k === 7 ? 12 : 0), "square", 0.09, stepDur * 0.85, 0);
  if (k % 2 === 0) note(BASS[bar], "triangle", 0.16, stepDur * 1.6, -2);
  if (k % 2 === 1) { // hat
    const n = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.03), AC.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = n; g.gain.value = 0.12;
    s.connect(g); g.connect(musGain); s.start(now);
  }
}

/* overlay (HTML) */
function showOverlay(title, body, buttons, stats) {
  const card = $("ovcard"); card.innerHTML = "";
  const h = document.createElement("h1"); h.textContent = title; card.appendChild(h);
  const p = document.createElement("p"); p.textContent = body; card.appendChild(p);
  if (stats) { const st = document.createElement("p"); st.className = "stats"; st.textContent = stats; card.appendChild(st); }
  buttons.forEach((b) => {
    const el = document.createElement("button"); el.type = "button"; el.textContent = b.label;
    if (b.alt) el.className = "alt";
    el.onclick = () => { unlockAudio(); b.fn(); };
    card.appendChild(el);
  });
  $("overlay").className = "show";
}
function hideOverlay() { $("overlay").className = ""; $("ovcard").innerHTML = ""; }


/* ---------------- slapstick sound kit (Web Audio only: oscillators + noise) ---------------- */
function aok() { return AC && !G.muted && G.sfxOn; }
/* one oscillator following a pitch path [[sec,hz],...], optional vibrato */
function vox(type, path, vol, delay, vib, vdepth) {
  if (!aok()) return;
  const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  const end = t0 + path[path.length - 1][0];
  o.type = type; o.frequency.setValueAtTime(path[0][1], t0);
  for (let i = 1; i < path.length; i++) o.frequency.exponentialRampToValueAtTime(Math.max(20, path[i][1]), t0 + path[i][0]);
  if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vib; lg.gain.value = vdepth || 20; l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(end + 0.06); }
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.setValueAtTime(vol, Math.max(t0 + 0.011, end - 0.05)); g.gain.exponentialRampToValueAtTime(0.001, end + 0.03);
  o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(end + 0.07);
}
/* brass note with a "wah" lowpass sweep and vibrato (sad trombone, muffled yelling) */
function brass(f0, f1, dur, vol, delay, wah) {
  if (!aok()) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
  o.type = "sawtooth"; o2.type = "square"; o.frequency.setValueAtTime(f0, t0); o2.frequency.setValueAtTime(f0 * 1.004, t0);
  if (f1 !== f0) { o.frequency.exponentialRampToValueAtTime(f1, t0 + dur); o2.frequency.exponentialRampToValueAtTime(f1 * 1.004, t0 + dur); }
  l.frequency.value = 5.5; lg.gain.value = f0 * 0.02; l.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  f.type = "lowpass"; f.Q.value = 5; f.frequency.setValueAtTime(320, t0); f.frequency.linearRampToValueAtTime(wah || 1500, t0 + dur * 0.35); f.frequency.linearRampToValueAtTime(300, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.04); g.gain.setValueAtTime(vol, t0 + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur + 0.05);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(sfxGain);
  [o, o2, l].forEach((n) => { n.start(t0); n.stop(t0 + dur + 0.1); });
}
function sfx2(name, a) {
  const R = Math.random;
  switch (name) {
    case "crunch": // impact: crack + thump + gravel
      noise(0.3, 0.9, 1400, 160); noise(0.08, 0.8, 4200, 1500); vox("square", [[0, 130], [0.28, 38]], 0.6); vox("sine", [[0, 72], [0.42, 28]], 0.9);
      for (let i = 0; i < 5; i++) noise(0.035, 0.55, 2500 + R() * 2500, 800, 0.05 + i * 0.045 + R() * 0.02);
      break;
    case "boing": vox("sine", [[0, 150], [0.12, 520], [0.3, 190], [0.5, 430], [0.78, 160]], 0.6, 0.06, 16, 30); vox("triangle", [[0, 300], [0.12, 1040], [0.3, 380], [0.5, 860], [0.78, 320]], 0.22, 0.06, 16, 50); break;
    case "pop": vox("sine", [[0, 260], [0.08, 1000]], 0.55); noise(0.07, 0.5, 2500, 900); break;
    case "jug": { // hollow plastic clang; each bounce a bit lower and softer
      const n = a || 0, k = Math.pow(0.78, n), f = 560 * (0.85 + R() * 0.4) * (1 - n * 0.12);
      vox("sine", [[0, f], [0.24, f * 0.6]], 0.55 * k + 0.2); vox("triangle", [[0, f * 2.1], [0.2, f * 1.25]], 0.3 * k + 0.1); noise(0.05, 0.55 * k + 0.1, 3200, 1200); vox("sine", [[0, f * 3.3], [0.12, f * 2.8]], 0.14); break; }
    case "sploosh": // wet coffee explosion
      noise(0.6, 0.85, 1100, 170); noise(0.3, 0.55, 3000, 500, 0.04); vox("sine", [[0, 110], [0.38, 42]], 0.75);

/* ---------------- text helpers ---------------- */
function wrapLines(c, text, maxW) {
  const words = String(text).split(" "), lines = [];
  let cur = "";
  words.forEach((w) => {
    const t = cur ? cur + " " + w : w;
    if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  });
  if (cur) lines.push(cur);
  return lines;
}
const FONT = "Trebuchet MS,Tahoma,sans-serif";
function fitText(c, text, maxW, maxH, startPx, minPx, weight) {
  let px = startPx, lines;
  for (; px >= minPx; px -= 1) {
    c.font = (weight || "bold") + " " + px + "px " + FONT;
    lines = wrapLines(c, text, maxW);
    if (lines.length * px * 1.18 <= maxH) break;
  }
  return { px, lines };
}
function drawText(c, text, x, y, px, color, align, weight) {
  c.font = (weight || "bold") + " " + px + "px " + FONT;
  c.fillStyle = color || "#fff"; c.textAlign = align || "center"; c.textBaseline = "alphabetic";
  c.fillText(text, x, y);
}
function strokeText(c, text, x, y, px, fill, stroke, align) {
  c.font = "bold " + px + "px " + FONT; c.textAlign = align || "center"; c.textBaseline = "alphabetic";
  c.lineJoin = "round"; c.lineWidth = Math.max(3, px / 6); c.strokeStyle = stroke; c.strokeText(text, x, y);
  c.fillStyle = fill; c.fillText(text, x, y);
}
function bubble(c, x, y, w, h, tailX, tailY, accent, fill) {
  c.save();
  rr(c, x, y, w, h, 16);
  c.fillStyle = fill || "#fffef6"; c.fill();
  c.strokeStyle = accent || "#1a120c"; c.lineWidth = 4; c.stroke();
  if (tailX != null) {
    const bx = clamp(tailX, x + 24, x + w - 24), by = y + h;
    c.beginPath(); c.moveTo(bx - 10, by - 1); c.lineTo(tailX, tailY); c.lineTo(bx + 10, by - 1);
    c.fillStyle = fill || "#fffef6"; c.fill(); c.strokeStyle = accent || "#1a120c"; c.stroke();
    c.beginPath(); c.moveTo(bx - 8, by - 1); c.lineTo(bx + 8, by - 1); c.strokeStyle = fill || "#fffef6"; c.lineWidth = 6; c.stroke();
  }
  c.restore();
}
function sideBubble(c, x, y, text, accent) { // small bubble anchored left-middle to an animal
  c.save();
  c.font = "bold 14px " + FONT;
  const lines = wrapLines(c, text, 190), lh = 17;
  const tw = Math.max.apply(null, lines.map((l) => c.measureText(l).width));
  const w = tw + 22, h = lines.length * lh + 14;
  const bx = clamp(x, 6, W - w - 6), by = y - h / 2;
  rr(c, bx, by, w, h, 12); c.fillStyle = "#fffef6"; c.fill();
  c.strokeStyle = accent || "#1a120c"; c.lineWidth = 3; c.stroke();
  c.beginPath(); c.moveTo(bx + 1, by + h / 2 - 7); c.lineTo(bx - 12, by + h / 2 + 4); c.lineTo(bx + 1, by + h / 2 + 7);
  c.fillStyle = "#fffef6"; c.fill(); c.strokeStyle = accent || "#1a120c"; c.stroke();
  c.fillStyle = "#1a120c"; c.textAlign = "left"; c.textBaseline = "alphabetic";
  lines.forEach((l, i) => c.fillText(l, bx + 11, by + 18 + i * lh));
  c.restore();
}

  const pf = G.perf; pf.samples.push(dt0 * 1000); if (pf.samples.length > 180) pf.samples.shift();
  if (ts - pf.last > 400) { const avg = pf.samples.reduce((a, b) => a + b, 0) / pf.samples.length; pf.fps = 1000 / Math.max(4, avg);
    const s = pf.samples.slice().sort((a, b) => a - b); pf.p95 = s[Math.floor(s.length * 0.95)] || 16.7; pf.last = ts; }
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  if (G.state === "intro" || G.state === "select") updateParts(dt);
  else if (P && !G.paused) updatePlayAll(dt);
  if (G.state === "intro") drawIntro(ctx);
  else if (G.state === "select") drawSelect(ctx);
  else if (P) drawPlayScene(ctx);
  requestAnimationFrame(frame);
}

/* ---------------- QA bot + hooks (no keyboard) ---------------- */
function toClient(x, y) { const r = canvas.getBoundingClientRect(); return { x: r.left + x / W * r.width, y: r.top + y / H * r.height }; }
function nextPipe() { const bx = birdX(); return P.pipes.find((p) => p.x + PIPE_W + LIP_X + BIRD_R > bx && !p.passed); }
function makeBot(cfg) {
  cfg = Object.assign({ lag: 0.1, noise: 8, bias: 8, minGap: 0.16, look: 0.1, lead: 0.08 }, cfg || {});
  const hist = []; let lastFlap = -9, nz = 0, nzT = 0;
  return {
    cfg,
    observe() {
      const p = nextPipe(); let tgt = floorY() * 0.5;
      if (p) tgt = pairCy(p) + (p.move ? p.move.amp * p.move.freq * cfg.look * Math.cos(P.t * p.move.freq + p.move.phase) : 0);
      else tgt = P.finishing ? floorY() - 120 : P.lastCy;
      hist.push({ y: P.y, vy: P.vy, tgt });
      if (hist.length > 400) hist.shift();
    },
    wants() {
      if (P.phase === "ready") return true;
      if (P.phase !== "run") return false;
      const lagN = Math.round(cfg.lag * 120), s = hist[Math.max(0, hist.length - 1 - lagN)];
      if (!s) return false;
      if (P.t - nzT > 0.04) { nzT = P.t; nz = (Math.random() + Math.random() + Math.random() - 1.5) * 2 * cfg.noise; }
      if (P.t - lastFlap < cfg.minGap) return false;
      if (P.t < GRACE - 0.3) return false;
      if (s.y + s.vy * cfg.lead + nz > s.tgt + cfg.bias) { lastFlap = P.t; return true; }
      return false;
    }
  };
}
function simulate(cfg, maxT) {
  newRun(); G.state = "ready"; G.bot = makeBot(cfg); G.muted = true;
  const h = 1 / 120; let t = 0;
  while (t < (maxT || 120) && (P.phase === "ready" || P.phase === "run")) {
    if (G.bot.wants()) flap();
    if (P.phase === "run") stepPhysics(h);
    t += h;
  }
  const r = { result: P.phase === "won" ? "win" : P.phase === "dead" ? "lose" : "timeout", passed: P.passed, t: P.t, score: P.score, flaps: P.flaps, ph: P.ph };
  G.bot = null; return r;
}
window.EA_DEBUG = {
  get state() { return G.state; }, G, get P() { return P; }, get perf() { return G.perf; }, get frames() { return G.frames || 0; },
  cardClient(i) { const cd = selectCards()[i]; return toClient(cd.x + cd.w / 2, cd.y + cd.h / 2); },
  startClient() { const b = startBtn(); return toClient(b.x + b.w / 2, b.y + b.h / 2); },
  start(who) { G.who = who || "f"; newRun(); G.state = "ready"; }, gotoSelect() { G.state = "select"; },
  forceSurprise(k) { doSurprise(k); }, forceLose() { die(); }, setTime(t) { P.t = t; },
  forceYelp(t) { yelp(t); }, sfxCount() { return { pfft: G.sfxCount.pfft, yelp: G.sfxCount.yelp }; }, resetSfx() { G.sfxCount.pfft = 0; G.sfxCount.yelp = 0; },
  pause(on) { G.paused = !!on; }, flap() { return flap(); },
  runBot(sec) { let t = 0; while (t < sec && (P.phase === 'ready' || P.phase === 'run')) { if (G.bot && G.bot.wants()) flap(); updatePlayAll(1 / 60); t += 1 / 60; } },
  advance(sec) { let n = Math.round(sec / 0.016); while (n-- > 0) updatePlayAll(0.016); }, logOn(on) { G.logOn = !!on; G.sfxLog = []; }, sfxLog() { return G.sfxLog.slice(); },
  makeBot(cfg) { G.bot = makeBot(cfg); return true; }, clearBot() { G.bot = null; },
  botWants() { return !!(G.bot && P && G.bot.wants()); },
  simulate(cfg, maxT) { const st = G.state; G.muted = true; const r = simulate(cfg, maxT); G.muted = false; G.state = st; return r; },
  snapshot() { return P ? { phase: P.phase, state: G.state, y: P.y, vy: P.vy, passed: P.passed, score: P.score, t: P.t, ph: P.ph, speed: P.speed, frames: G.frames, vis: document.visibilityState, deadT: P.deadT, winT: P.winT, visK: P.vis ? P.vis.k : null, visT: P.vis ? P.vis.t : 0, spinT: P.spinT, eepT: P.eepT } : null; },
  tune(o) { if (o.GRAV) GRAV = o.GRAV; if (o.FLAP_V) FLAP_V = o.FLAP_V; ['PH_GAP', 'PH_SPEED', 'PH_SPACE', 'PH_STEP'].forEach((k) => { if (o[k]) { const a = { PH_GAP, PH_SPEED, PH_SPACE, PH_STEP }[k]; o[k].forEach((v, i) => { a[i] = v; }); } }); return { PH_GAP, PH_SPEED, PH_SPACE, PH_STEP }; },
  ROUND
};
function boot() { applyMute(); requestAnimationFrame(frame); }
boot();
})();
