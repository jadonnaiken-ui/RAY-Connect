<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Founder's Life</title>
<style>
  :root { --ink: #1d1d2b; --paper: #fffdf6; --accent: #ff7a59; --good: #23a559; --bad: #e0384b;
          --stage-w: min(96vw, calc((100vh - 200px) * 1.25), 1000px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; color: var(--ink);
         background: radial-gradient(circle at 20% 10%, #ffe9c7, transparent 50%), radial-gradient(circle at 90% 90%, #d9ecff, transparent 50%), #f6efe4;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 6px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* HUD */
  .hud { width: var(--stage-w); min-width: 300px; display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .co { flex: 1 1 150px; background: var(--ink); color: #fff; border-radius: 12px; padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; }
  .co b { font-size: 17px; letter-spacing: .3px; }
  .co small { font-size: 11px; opacity: .75; }
  .stat { flex: 1 1 130px; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 10px 6px; box-shadow: 0 3px 0 var(--ink); }
  .stat.tiny { flex: 0 0 auto; text-align: center; }
  .stat label { display: block; font-size: 10px; font-weight: 900; letter-spacing: 1px; opacity: .6; }
  .stat b { font-size: 19px; font-weight: 900; }
  .bar { position: relative; height: 8px; background: #e7e1d4; border-radius: 99px; margin-top: 3px; overflow: visible; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--good); transition: width .5s, background .5s; }
  .bar .uni { position: absolute; right: -6px; top: -9px; font-size: 15px; }
  .iconbtn { flex: 0 0 auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); font-size: 18px; padding: 0 10px; cursor: pointer; }
  .iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  #todo { width: var(--stage-w); min-width: 300px; font-size: 13px; font-weight: 800; text-align: center; min-height: 18px; }
  #todo span { background: #ffe27a; border: 2px solid var(--ink); border-radius: 99px; padding: 1px 8px; margin: 0 2px; display: inline-block; }

  /* stage */
  .stage { position: relative; width: var(--stage-w); min-width: 300px; aspect-ratio: 5 / 4; }
  .stage.shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translate(-7px, 3px); } 40% { transform: translate(6px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
  canvas#c { width: 100%; height: 100%; display: block; border: 4px solid var(--ink); border-radius: 14px; image-rendering: pixelated; background: #4a4063; box-shadow: 0 6px 0 var(--ink); cursor: pointer; }

  /* dialog */
  .box { background: var(--paper); border: 4px solid var(--ink); border-radius: 12px; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #8fa3e6, 0 5px 0 var(--ink); }
  #dlg { position: absolute; left: 2.5%; right: 2.5%; bottom: 3%; max-height: 94%; overflow: auto; padding: 12px 14px; z-index: 5; animation: rise .25s cubic-bezier(.2,1.3,.4,1); touch-action: pan-y; }
  #dlg.hidden, .overlay.hidden { display: none; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
  .dlg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #portrait { width: 44px; height: 44px; border: 3px solid var(--ink); border-radius: 10px; background: #dfe8ff; display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; flex: 0 0 auto; }
  #portrait canvas { width: 40px; height: 52px; image-rendering: pixelated; margin-top: 8px; }
  #dlgName { font-weight: 900; font-size: 15px; }
  #dlgName small { display: block; font-weight: 700; font-size: 11px; opacity: .6; }
  #dlgText { font-size: clamp(14px, 2.1vw, 17px); font-weight: 650; line-height: 1.38; min-height: 2.6em; }
  .deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .delta { font-weight: 900; font-size: 14px; border: 2.5px solid var(--ink); border-radius: 99px; padding: 2px 10px; background: #fff; animation: popin .4s cubic-bezier(.2,1.6,.4,1) both; }
  .delta.up { background: #c9f5d6; } .delta.down { background: #ffd0d5; }
  #dlgChoices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .choice { text-align: left; font-family: inherit; font-weight: 800; font-size: clamp(14px, 2vw, 16px); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 12px 8px 28px; cursor: pointer; position: relative; box-shadow: 0 3px 0 var(--ink); animation: popin .3s cubic-bezier(.2,1.5,.4,1) both; }
  .choice.sel { background: #ffe27a; }
  .choice.sel::before { content: "▶"; position: absolute; left: 9px; animation: nudge .6s infinite; }
  @keyframes nudge { 50% { transform: translateX(3px); } }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } }

  .overlay { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(29,29,43,.5); border-radius: 14px; }
  .card { width: min(92%, 520px); max-height: 94%; overflow: auto; padding: 16px 18px; text-align: center; animation: popin .45s cubic-bezier(.2,1.5,.4,1); touch-action: pan-y; }
  .card h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: 1px; line-height: 1; }
  .card h1 em { font-style: normal; color: var(--accent); }
  .card .big { font-size: 46px; line-height: 1.1; }
  .card p { margin: 8px 0; font-weight: 650; line-height: 1.4; font-size: 15px; }
  .card .pitch { background: #fff; border: 3px dashed var(--ink); border-radius: 12px; padding: 8px; font-weight: 800; }
  .card .rules { text-align: left; font-size: 14px; display: grid; gap: 4px; margin: 10px 0; }
  .btn { font-family: inherit; font-weight: 900; font-size: 17px; color: var(--ink); background: var(--accent); border: 3px solid var(--ink); border-radius: 12px; padding: 10px 18px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; margin: 4px; }
  .btn.alt { background: #8fd3ff; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .small { font-size: 12px; opacity: .65; font-weight: 700; }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; font-size: 13px; font-weight: 800; }
  .statgrid div { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 5px; }

  .pop { position: absolute; left: 50%; top: 38%; z-index: 7; pointer-events: none; font-weight: 900; font-size: clamp(34px, 8vw, 72px); color: #fff;
         -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); animation: bigpop 1.4s cubic-bezier(.2,1.5,.4,1) forwards; white-space: nowrap; }
  .pop.up { color: #6ef09a; } .pop.down { color: #ff6b7a; }
  @keyframes bigpop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; }
                      70% { transform: translate(-50%, -60%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -90%) scale(.9); opacity: 0; } }
  .hint { font-size: 12px; font-weight: 800; opacity: .55; text-align: center; }
</style>
</head>

}

  if (p && p.talk) { if (p.sfx) SFX[p.sfx](); showDialog({ who: { name: "You", title: "Founder & CEO", look: FOUNDER }, text: pick(p.talk), choices: OK(null, "Back to work") }); return true; }
  return false;
}

  // room name signs on the back wall of each room
  const signs = [["hire", 3, 0], ["product", 8, 0], ["fund", 16, 0], ["finance", 4.5, 9], ["ops", 14, 9]];
  signs.forEach(([z, x, y]) => label(`${ZONES[z].icon} ${ZONES[z].name}`, x * T + 8, y * T + 8, 7, "#1d1d2b", "#fff7d6"));
  // hall posters & windows
  [[1, 5], [8, 5], [12, 5], [18, 5]].forEach(([x, y], i) => {
    const X = x * T, Y = y * T;
    if (i % 2 === 0) { R(X + 2, Y + 4, 12, 8, "#1d1d2b"); R(X + 3, Y + 5, 10, 6, "#9fd8ff"); R(X + 3, Y + 8, 10, 1, "#1d1d2b"); R(X + 8, Y + 5, 1, 6, "#1d1d2b"); }
    else { R(X + 3, Y + 3, 10, 10, "#1d1d2b"); R(X + 4, Y + 4, 8, 8, i === 1 ? "#ffe27a" : "#ffc3d8"); emo(i === 1 ? "📈" : "🦄", X + 8, Y + 8.5, 6); }
  });
  // whiteboard on product wall
  const WB = 10 * T + 2;
  R(WB, 4, 28, 9, "#1d1d2b"); R(WB + 1, 5, 26, 7, "#fff");
  if (Math.floor(t / 900) % 2) R(WB + 3, 7, 8, 1, "#e0384b");
  R(WB + 12, 9, 9, 1, "#3a6fe0"); R(WB + 21, 6, 4, 3, "#23a559");
}
function drawProp(p, t) {
  const X = p.x * T, Y = p.y * T, W = p.w * T, H = p.h * T, O = "#1d1d2b";
  switch (p.d) {
    case "plant":
      R(X + 4, Y + 9, 8, 6, O); R(X + 5, Y + 10, 6, 4, "#c2683e");
      R(X + 3, Y + 2, 10, 8, O); R(X + 4, Y + 3, 8, 6, "#4caf50"); R(X + 6, Y + 1, 4, 3, O); R(X + 7, Y + 1, 2, 3, "#66c46a"); R(X + 5, Y + 4, 2, 2, "#7fd383"); break;
    case "desk": case "founderdesk":
      R(X, Y + 4, W, 10, O); R(X + 1, Y + 5, W - 2, 5, "#b07a45"); R(X + 1, Y + 10, W - 2, 3, "#8a5a30");
      R(X + W / 2 - 6, Y - 2, 12, 9, O); R(X + W / 2 - 5, Y - 1, 10, 6, p.d === "founderdesk" ? "#ffb3c7" : "#7fd3ff");
      if (Math.floor(t / 500) % 2) R(X + W / 2 - 3, Y + 1, 4, 1, "#fff");
      if (p.d === "founderdesk") emo("🌯", X + 4, Y + 6, 6);
      if (p.x === 6) emo("🧮", X + 25, Y + 6, 7);
      break;
    case "chairs": for (let i = 0; i < p.w; i++) { R(X + i * T + 3, Y + 3, 10, 10, O); R(X + i * T + 4, Y + 4, 8, 5, "#e85d9e"); R(X + i * T + 4, Y + 9, 8, 3, "#b53f78"); } break;
    case "lab": R(X, Y + 4, W, 10, O); R(X + 1, Y + 5, W - 2, 8, "#e8eef5"); emo("🧪", X + 7, Y + 5, 8); emo("🦆", X + 22, Y + 6, 8); break;
    case "beanbag": R(X + 2, Y + 5, 12, 9, O); R(X + 3, Y + 6, 10, 7, "#ff9a3c"); R(X + 4, Y + 7, 4, 2, "#ffc07d"); break;
    case "couch": R(X, Y + 2, W, 12, O); R(X + 1, Y + 3, W - 2, 5, "#7b5cd6"); R(X + 1, Y + 8, W - 2, 5, "#9a7cf0"); R(X + 1, Y + 3, 3, 10, "#6a4cc4"); R(X + W - 4, Y + 3, 3, 10, "#6a4cc4"); break;
    case "ctable": R(X + 2, Y + 5, 12, 8, O); R(X + 3, Y + 6, 10, 5, "#d9c2ff"); emo("🥂", X + 8, Y + 7, 7); break;
    case "shark": R(X + 3, Y + 10, 10, 5, O); R(X + 4, Y + 11, 8, 3, "#c9a227"); emo("🦈", X + 8, Y + 5 + Math.sin(t / 400), 11); break;
    case "vault":
      R(X, Y, W, H, O); R(X + 1, Y + 1, W - 2, H - 2, "#8e9aa8");
      ctx.fillStyle = O; ctx.beginPath(); ctx.arc(X + 16, Y + 16, 13, 0, 7); ctx.fill(); ctx.fillStyle = "#b8c3cf"; ctx.beginPath(); ctx.arc(X + 16, Y + 16, 12, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(X + 16, Y + 16); ctx.rotate(t / 1500); R(-7, -1, 14, 2, O); R(-1, -7, 2, 14, O); ctx.restore(); break;
    case "money": R(X + 4, Y + 9, 8, 6, O); R(X + 5, Y + 10, 6, 4, "#c2683e"); emo("💸", X + 8, Y + 5 + Math.sin(t / 300), 9); break;
    case "files": for (let i = 0; i < p.w; i++) { R(X + i * T + 2, Y, 12, 15, O); R(X + i * T + 3, Y + 1, 10, 13, "#9aa5b1"); R(X + i * T + 3, Y + 7, 10, 1, O); R(X + i * T + 7, Y + 3, 2, 1, O); R(X + i * T + 7, Y + 10, 2, 1, O); } break;
    case "servers":
      for (let i = 0; i < p.w; i++) {
        const sx = X + i * T; R(sx + 1, Y - 6, 14, 21, O); R(sx + 2, Y - 5, 12, 19, "#2f3640");
        for (let j = 0; j < 4; j++) { R(sx + 3, Y - 3 + j * 4, 10, 2, "#3d4654"); R(sx + 11, Y - 3 + j * 4, 1, 1, (Math.floor(t / 180) + i + j) % 3 ? "#4cff7a" : "#ff5a5a"); }
      } break;
    case "boxes":
      [[0, 0], [16, 0], [0, 16], [16, 16], [8, -6]].forEach(([dx, dy], i) => { if (i === 4 || dy < H) { R(X + dx + 1, Y + dy + 2, 14, 13, O); R(X + dx + 2, Y + dy + 3, 12, 11, "#d6a564"); R(X + dx + 2, Y + dy + 7, 12, 1, "#b8864a"); } }); break;
    case "redbtn": R(X + 3, Y + 8, 10, 7, O); R(X + 4, Y + 9, 8, 5, "#555"); ctx.fillStyle = O; ctx.beginPath(); ctx.arc(X + 8, Y + 8, 5, 0, 7); ctx.fill(); ctx.fillStyle = Math.floor(t / 400) % 2 ? "#ff3b3b" : "#c91e1e"; ctx.beginPath(); ctx.arc(X + 8, Y + 8, 4, 0, 7); ctx.fill(); break;
    case "coffee": R(X + 2, Y, 12, 15, O); R(X + 3, Y + 1, 10, 13, "#c0392b"); R(X + 5, Y + 3, 6, 3, "#2c2c2c"); R(X + 6, Y + 9, 4, 4, "#fff"); if (Math.floor(t / 300) % 3 === 0) R(X + 7, Y + 6, 1, 2, "#e6e6e6"); break;
    case "pingpong": R(X, Y + 3, W, 11, O); R(X + 1, Y + 4, W - 2, 9, "#2e8b57"); R(X + W / 2, Y + 3, 1, 11, "#fff"); R(X + 1, Y + 8, W - 2, 1, "#fff");
      { const k = (Math.sin(t / 250) + 1) / 2; R(X + 4 + k * (W - 10), Y + 6 - Math.abs(Math.sin(t / 125)) * 4, 2, 2, "#fff"); } break;
  }
}
function shadow(x, y, w) { ctx.fillStyle = "rgba(29,29,43,.22)"; ctx.beginPath(); ctx.ellipse(x, y, w, 2.5, 0, 0, 7); ctx.fill(); }
function draw(t) {
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  drawTiles(t);
  props.forEach(p => drawProp(p, t));
  // entities sorted by y
  const ents = [];
  Object.values(NPCS).forEach(n => ents.push({ y: n.y, draw: () => {
    const X = n.x * T, Y = n.y * T, bob = Math.floor(t / 600 + n.x) % 2;
    shadow(X + 8, Y + 15, 6);
    const face = Math.abs(player.x - n.x) + Math.abs(player.y - n.y) <= 2 ? dirFromTo(n, player) : "down";
    ctx.drawImage(personSprite(n.look, face, 0), X, Y - 3 - bob * .5 + .5);
    if (active.includes(n.zone) && !G.over) {
      const by = Y - 15 + Math.sin(t / 180) * 2;
      R(X + 3, by - 1, 10, 11, "#1d1d2b"); R(X + 4, by, 8, 9, "#ffe27a"); R(X + 7, by + 10, 2, 2, "#1d1d2b");
      R(X + 7, by + 1, 2, 5, "#e0384b"); R(X + 7, by + 7, 2, 1, "#e0384b");
    }
  } }));
  ents.push({ y: dog.py, draw: () => { const X = dog.px * T, Y = dog.py * T; shadow(X + 8, Y + 14, 6); ctx.drawImage(dogSprite(dog.dir, dog.moving ? Math.floor(t / 120) : Math.floor(t / 400)), X - 1, Y + 3); } });
  ents.push({ y: player.py, draw: () => {
    const X = player.px * T, Y = player.py * T;
    shadow(X + 8, Y + 15, 6);
    const fr = player.moving ? (player.t < .5 ? 1 + (player.step % 2) : 0) : 0;
    ctx.drawImage(personSprite(FOUNDER, player.dir, fr), X, Y - 3 - (fr ? 1 : 0));
  } });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  // tap target marker
  if (player.path.length && !player.target) { const [lx, ly] = player.path[player.path.length - 1]; ctx.strokeStyle = "rgba(255,122,89,.9)"; ctx.lineWidth = 1; ctx.strokeRect(lx * T + 2.5, ly * T + 2.5, 11, 11); }
  // particles
  particles.forEach(p => emo(p.e, p.x, p.y, 10, p.rot));
  // dark vignette when game over
  if (G.over) { ctx.fillStyle = "rgba(29,29,43,.25)"; ctx.fillRect(0, 0, MW * T, MH * T); }
}
function dirFromTo(a, b) { const dx = b.x - a.x, dy = b.y - a.y; return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"); }

/* ============================================================
   LOOP
   ============================================================ */
function frame(t) {
  const dt = Math.min(60, t - lastT); lastT = t;
  updatePlayer(dt); updateDog(dt, t); typeTick(t);
  // valuation counter animates in log space
  if (Math.abs(G.shown - G.val) > .001) {
    const a = Math.log(Math.max(G.shown, .01)), b = Math.log(Math.max(G.val, .01));
    G.shown = Math.exp(a + (b - a) * .08); if (Math.abs(b - a) < .002) G.shown = G.val;
    $("val").textContent = fmt(G.shown);
  }
  particles.forEach(p => { p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.rot += p.vr; p.life += dt; });
  particles = particles.filter(p => p.y < MH * T + 20 && p.life < 6000);
  draw(t);
  requestAnimationFrame(frame);
}

/* ============================================================
   INPUT
   ============================================================ */
const KEYMAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
addEventListener("keydown", e => {
  initAudio();
  if (e.key === "m" || e.key === "M") { toggleMute(); return; }
  const d = KEYMAP[e.key];
  if (!$("ov").classList.contains("hidden")) {
    if (e.key === "Enter" || e.key === " ") { const b = $("card").querySelector("button"); if (b) { e.preventDefault(); b.click(); } }
    return;
  }
  if (dialog) {
    e.preventDefault();
    if (dialog.typing && (e.key === "Enter" || e.key === " " || e.key === "z" || e.key === "Z")) { finishTyping(); return; }
    if (d === "up") setSel((dialog.sel + dialog.choices.length - 1) % dialog.choices.length);
    else if (d === "down") setSel((dialog.sel + 1) % dialog.choices.length);
    else if (e.key === "Enter" || e.key === " " || e.key === "z" || e.key === "Z") choose(dialog.sel);
    else if (/^[1-9]$/.test(e.key) && !dialog.typing) choose(+e.key - 1);
    return;
  }
  if (d) { e.preventDefault(); if (!keys.includes(d)) keys.push(d); return; }
  if (e.key === "Enter" || e.key === " " || e.key === "z" || e.key === "Z") {
    e.preventDefault(); if (!player.moving) { const [dx, dy] = DIRV[player.dir]; interactAt(player.x + dx, player.y + dy); }
  }
});
addEventListener("keyup", e => { const d = KEYMAP[e.key]; if (d) keys = keys.filter(k => k !== d); });
addEventListener("blur", () => keys = []);
cv.addEventListener("pointerdown", e => {
  initAudio();
  if (dialog) { if (dialog.typing) finishTyping(); return; }
  const r = cv.getBoundingClientRect();
  const tx = Math.floor((e.clientX - r.left) / r.width * MW), ty = Math.floor((e.clientY - r.top) / r.height * MH);
  tapTile(tx, ty);
});
$("dlg").addEventListener("pointerdown", e => { if (dialog && dialog.typing && !e.target.closest("button")) finishTyping(); });
function toggleMute() { muted = !muted; localStorage.setItem("fl-muted", muted ? "1" : "0"); applyMute(); }
$("muteBtn").addEventListener("click", () => { initAudio(); toggleMute(); });
$("hint").textContent = matchMedia("(pointer: coarse)").matches ? "Tap to walk · tap a person to talk" : "Arrow keys / WASD to walk · walk into people to talk · Space to interact · M to mute · or click to walk";

/* boot */
titleScreen();
requestAnimationFrame(t => { lastT = t; frame(t); });
</script>
</body>
