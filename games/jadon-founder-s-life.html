<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Founder's Life</title>
<style>
  :root { --ink: #1d1d2b; --paper: #fffdf6; --accent: #ff7a59; --good: #23a559; --bad: #e0384b;
          --stage-w: min(96vw, calc((100vh - 200px) * 1.25), 1000px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; color: var(--ink);
         background: radial-gradient(circle at 20% 10%, #ffe9c7, transparent 50%), radial-gradient(circle at 90% 90%, #d9ecff, transparent 50%), #f6efe4;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 6px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* HUD */
  .hud { width: var(--stage-w); min-width: 300px; display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .co { flex: 1 1 150px; background: var(--ink); color: #fff; border-radius: 12px; padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; }
  .co b { font-size: 17px; letter-spacing: .3px; }
  .co small { font-size: 11px; opacity: .75; }
  .stat { flex: 1 1 130px; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 10px 6px; box-shadow: 0 3px 0 var(--ink); }
  .stat.tiny { flex: 0 0 auto; text-align: center; }
  .stat label { display: block; font-size: 10px; font-weight: 900; letter-spacing: 1px; opacity: .6; }
  .stat b { font-size: 19px; font-weight: 900; }
  .bar { position: relative; height: 8px; background: #e7e1d4; border-radius: 99px; margin-top: 3px; overflow: visible; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--good); transition: width .5s, background .5s; }
  .bar .uni { position: absolute; right: -6px; top: -9px; font-size: 15px; }
  .iconbtn { flex: 0 0 auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); font-size: 18px; padding: 0 10px; cursor: pointer; }
  .iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  #todo { width: var(--stage-w); min-width: 300px; font-size: 13px; font-weight: 800; text-align: center; min-height: 18px; }
  #todo span { background: #ffe27a; border: 2px solid var(--ink); border-radius: 99px; padding: 1px 8px; margin: 0 2px; display: inline-block; }

  /* stage */
  .stage { position: relative; width: var(--stage-w); min-width: 300px; aspect-ratio: 5 / 4; }
  .stage.shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translate(-7px, 3px); } 40% { transform: translate(6px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
  canvas#c { width: 100%; height: 100%; display: block; border: 4px solid var(--ink); border-radius: 14px; image-rendering: pixelated; background: #4a4063; box-shadow: 0 6px 0 var(--ink); cursor: pointer; }

  /* dialog */
  .box { background: var(--paper); border: 4px solid var(--ink); border-radius: 12px; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #8fa3e6, 0 5px 0 var(--ink); }
  #dlg { position: absolute; left: 2.5%; right: 2.5%; bottom: 3%; max-height: 94%; overflow: auto; padding: 12px 14px; z-index: 5; animation: rise .25s cubic-bezier(.2,1.3,.4,1); touch-action: pan-y; }
  #dlg.hidden, .overlay.hidden { display: none; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
  .dlg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #portrait { width: 44px; height: 44px; border: 3px solid var(--ink); border-radius: 10px; background: #dfe8ff; display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; flex: 0 0 auto; }
  #portrait canvas { width: 40px; height: 52px; image-rendering: pixelated; margin-top: 8px; }
  #dlgName { font-weight: 900; font-size: 15px; }
  #dlgName small { display: block; font-weight: 700; font-size: 11px; opacity: .6; }
  #dlgText { font-size: clamp(14px, 2.1vw, 17px); font-weight: 650; line-height: 1.38; min-height: 2.6em; }
  .deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .delta { font-weight: 900; font-size: 14px; border: 2.5px solid var(--ink); border-radius: 99px; padding: 2px 10px; background: #fff; animation: popin .4s cubic-bezier(.2,1.6,.4,1) both; }
  .delta.up { background: #c9f5d6; } .delta.down { background: #ffd0d5; }
  #dlgChoices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .choice { text-align: left; font-family: inherit; font-weight: 800; font-size: clamp(14px, 2vw, 16px); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 12px 8px 28px; cursor: pointer; position: relative; box-shadow: 0 3px 0 var(--ink); animation: popin .3s cubic-bezier(.2,1.5,.4,1) both; }
  .choice.sel { background: #ffe27a; }
  .choice:disabled { opacity: .45; text-decoration: line-through; cursor: not-allowed; box-shadow: none; }
  #todo span.opt { background: #ffd9c9; }
  #todo span.whim { background: #ff7a59; color: #fff; margin-top: 4px; }
  .choice.sel::before { content: "▶"; position: absolute; left: 9px; animation: nudge .6s infinite; }
  @keyframes nudge { 50% { transform: translateX(3px); } }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } }

  .overlay { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(29,29,43,.5); border-radius: 14px; }
  .card { width: min(92%, 520px); max-height: 94%; overflow: auto; padding: 16px 18px; text-align: center; animation: popin .45s cubic-bezier(.2,1.5,.4,1); touch-action: pan-y; }
  .card h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: 1px; line-height: 1; }
  .card h1 em { font-style: normal; color: var(--accent); }
  .card .big { font-size: 46px; line-height: 1.1; }
  .card p { margin: 8px 0; font-weight: 650; line-height: 1.4; font-size: 15px; }
  .card .pitch { background: #fff; border: 3px dashed var(--ink); border-radius: 12px; padding: 8px; font-weight: 800; }
  .card .rules { text-align: left; font-size: 14px; display: grid; gap: 4px; margin: 10px 0; }
  .btn { font-family: inherit; font-weight: 900; font-size: 17px; color: var(--ink); background: var(--accent); border: 3px solid var(--ink); border-radius: 12px; padding: 10px 18px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; margin: 4px; }
  .btn.alt { background: #8fd3ff; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .small { font-size: 12px; opacity: .65; font-weight: 700; }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; font-size: 13px; font-weight: 800; }
  .statgrid div { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 5px; }

  .pop { position: absolute; left: 50%; top: 38%; z-index: 7; pointer-events: none; font-weight: 900; font-size: clamp(34px, 8vw, 72px); color: #fff;
         -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); animation: bigpop 1.4s cubic-bezier(.2,1.5,.4,1) forwards; white-space: nowrap; }
  .pop.up { color: #6ef09a; } .pop.down { color: #ff6b7a; }
  @keyframes bigpop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; }
                      70% { transform: translate(-50%, -60%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -90%) scale(.9); opacity: 0; } }
  .toast { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); z-index: 9; width: max-content; max-width: 90%; text-align: center;
           background: #ffe27a; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink); padding: 8px 14px; font-weight: 900; font-size: 14px;
           animation: toastIn 4.2s cubic-bezier(.2,1.4,.4,1) forwards; pointer-events: none; }
  @keyframes toastIn { 0% { transform: translate(-50%, -30px) scale(.6); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -20px); opacity: 0; } }
  .btn.go { background: #7ee8a0; }
  .card .btn { display: block; width: 100%; margin: 8px 0; }
  .card .btn .small { display: block; font-size: 11px; }
  /* title screen */
  body.on-title .hud, body.on-title #todo, body.on-title .hint { visibility: hidden; }
  .overlay.title { position: fixed; inset: 0; border-radius: 0; background: rgba(29,29,43,.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .overlay.title .card { width: min(88%, 420px); padding: 22px 24px 18px; }
  .overlay.title h1 { font-size: clamp(30px, 6vw, 42px); margin-bottom: 10px; }
  .intro { font-size: 16px !important; margin: 0 0 14px !important; }
  .intro span { font-size: 13px; opacity: .6; font-weight: 700; }
  .ladder { display: flex; justify-content: center; align-items: center; gap: 3px; margin: 0 0 14px; flex-wrap: wrap; }
  .ladder span { background: #fff; border: 2px solid var(--ink); border-radius: 99px; padding: 2px 7px; font-weight: 900; font-size: 12.5px; white-space: nowrap; }
  .ladder i { font-style: normal; font-weight: 900; opacity: .4; }
  .howto { list-style: none; padding: 0; margin: 0 0 16px; text-align: left; display: grid; gap: 7px; font-size: 14px; font-weight: 700; }
  .howto li { display: flex; gap: 10px; align-items: center; }
  .howto b { flex: 0 0 26px; text-align: center; }
  .hint { font-size: 12px; font-weight: 800; opacity: .55; text-align: center; }
</style>
</head>
<body>
  <div class="hud">
    <div class="co"><b id="coName">Startup</b><small id="coTag"></small></div>
    <div class="stat"><label id="valLabel">VALUATION → $1B 🦄</label><b id="val" class="mono">$5.0M</b><div class="bar"><i id="valBar"></i></div></div>
    <div class="stat"><label>BOARD TRUST</label><b id="trust">😐 60</b><div class="bar"><i id="trustBar"></i></div></div>
    <div class="stat tiny"><label>MONTH</label><b id="month" class="mono">1</b></div>
    <button class="iconbtn" id="muteBtn" type="button" aria-label="Mute music">🔊</button>
  </div>
  <div id="todo"></div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="dlg" class="box hidden">
      <div class="dlg-head"><div id="portrait"></div><div id="dlgName"></div></div>
      <div id="dlgText"></div>
      <div id="dlgExtra"></div>
      <div id="dlgChoices"></div>
    </div>
    <div class="overlay" id="ov"><div class="card box" id="card"></div></div>
  </div>
  <div class="hint" id="hint"></div>

<script>
"use strict";
/* ============================================================
   CONTENT — all the silly decisions live here.
   o = outcomes: [probability, multiplier, add ($M), board trust change, message]
   ============================================================ */
const O = (p, m, a, b, msg) => ({ p, m, a, b, msg });
const SENSIBLE_UP = .2, SENSIBLE_SOFT = .1;
/* ---- HIRE room: extra scenarios (tier 1 = startup, tier 2 = giant company) ---- */
const DECK_HIRE = [
  // ---------------- TIER 1 ----------------
  { tier: 1, t: "Rita wants to replace job interviews with an escape room. \"If they can't escape a locked room, they can't escape a down round.\"", c: [
      { t: "Lock the candidates in", o: [O(.45, 3, 0, 5, "A candidate escapes in 4 minutes and also fixes the lock's firmware. Hired as CTO. ×3!"), O(.55, .6, 0, -8, "Two candidates are still in there. Legal says this is \"technically a hostage situation.\"")] },
      { t: "Keep normal interviews", o: [O(.6, 1.3, 0, 4, "Boring, effective, nobody needed a locksmith. Good hires."), O(.4, .6, 0, -5, "Your rival's escape-room hiring goes viral. Every good candidate wants a puzzle now.")] } ] },

  { tier: 1, t: "The AI interviewer Rita bought has screened 900 applicants. It also screened the founder, whose application was rejected for \"lack of leadership signal.\"", c: [
      { t: "Accept the verdict and step down to IC", o: [O(.4, 3.5, 0, 8, "Without you in meetings, velocity triples. The board sends a fruit basket. ×3.5!"), O(.6, .6, 0, -10, "Kevin is made interim CEO by default. He has scheduled a sync about syncs.")] },
      { t: "Unplug the AI interviewer", o: [O(.6, 1.3, 0, 3, "Back to humans. Hiring improves because humans can't count to 900."), O(.4, .65, 0, -6, "📰 \"Founder Silences AI That Questioned Him\". Applicants decline in solidarity with the robot.")] } ] },

  { tier: 1, t: "Unlimited PTO has been live for a year. Total days taken company-wide: two. Both were Kevin. Rita proposes mandatory vacation.", c: [
      { t: "Force everyone to take 3 weeks off, same time", o: [O(.45, 3, 0, 4, "Everyone returns rested and ships more in a month than the last year. ×3!"), O(.55, .55, 0, -9, "The office sits empty for 3 weeks. A customer churns by walking in and finding only Biscuit.")] },
      { t: "Leave the policy alone", o: [O(.6, 1.25, 0, 3, "Unused PTO costs nothing. Penny's eye stops twitching for a day."), O(.4, .6, 0, -5, "Three engineers burn out at once and form a pottery commune.")] } ] },

  { tier: 1, t: "Kevin's annual review. He has completed zero tasks, attended every meeting, and nodded in all of them. Rita's draft rating: \"Exceeds.\"", c: [
      { t: "Promote Kevin to VP of Alignment", o: [O(.45, 2.8, 0, 6, "Kevin aligns nothing, offends no one. The board calls him \"a steady hand.\" ×2.8!"), O(.55, .6, 0, -8, "Kevin now has three direct reports. They have learned to nod.")] },
      { t: "Put Kevin on an improvement plan", o: [O(.55, 1.3, 0, 3, "Kevin completes one task. It is a spreadsheet. It is fine."), O(.45, .6, 0, -6, "Kevin appeals to the board. The board loves Kevin. You are now on a plan.")] } ] },

  { tier: 1, t: "A senior engineer's only reference is \"Dr. Rick Stanton\", who sounds exactly like the candidate wearing a fake mustache on a phone call.", c: [
      { t: "Hire him for the sheer commitment", o: [O(.45, 3, 0, 4, "His code is as committed as his mustache. Ships a feature per day. ×3!"), O(.55, .55, 0, -8, "\"Dr. Stanton\" also writes his performance reviews. They are glowing.")] },
      { t: "Ask Dr. Stanton to join the video call", o: [O(.6, 1.2, 0, 2, "The mustache falls off on camera. You pass. Good diligence."), O(.4, .65, 0, -4, "He joins as both people, on two laptops. Gigantica hires him that afternoon.")] } ] },

  { tier: 1, t: "Everyone at the startup wants a \"Chief\" title. Rita suggests giving all 14 employees one. There is a Chief Stapler Officer already lobbying.", c: [
      { t: "Make everyone a C-suite exec", o: [O(.45, 3, 0, 3, "Investors see \"14 C-level hires\" and assume momentum. Valuation ×3!"), O(.55, .6, 0, -7, "Fourteen chiefs, zero people. Nobody will take notes in meetings.")] },
      { t: "Keep titles honest", o: [O(.6, 1.25, 0, 3, "\"Engineer\" means engineer. Refreshing. Hiring gets easier."), O(.4, .6, 0, -5, "Your Senior Engineer gets poached as \"Chief Wizard\" by a startup with no product.")] } ] },

  { tier: 1, t: "Rita proposes a four-day work week, \"to optimise for joy KPIs.\" Penny wants to know what a joy KPI costs.", c: [
      { t: "Go to a three-day week, actually", o: [O(.4, 3.5, 0, 5, "Productivity rises because everyone panics on Wednesday. ×3.5!"), O(.6, .6, 0, -9, "Monday is now \"Tuesday\". The calendar collapses. Nothing ships.")] },
      { t: "Try four days for a quarter", o: [O(.6, 1.35, 20, 4, "Fridays off, retention up, recruiters weep. Solid win."), O(.4, .65, 0, -5, "Customers learn you are closed Fridays and schedule every crisis for Friday.")] } ] },

  { tier: 1, t: "Rita wants a return-to-office mandate, enforced by Biscuit, who will sniff every badge at the door. Biscuit is very excited.", c: [
      { t: "Deploy Biscuit as security", o: [O(.45, 2.8, 0, 4, "Attendance hits 100%. People come in just to be sniffed. ×2.8!"), O(.55, .6, 0, -7, "Biscuit lets in a sandwich delivery man and then the sandwich. Data breach.")] },
      { t: "Stay remote-friendly", o: [O(.6, 1.3, 0, 3, "Talent from 9 time zones applies. Standup now happens at all hours."), O(.4, .6, 0, -5, "Nobody has met since spring. Two engineers built the same product separately.")] } ] },

  { tier: 1, t: "Offsite planning. Rita has booked a \"trust-building\" weekend in a corn maze with no map, no phones, and one granola bar per team.", c: [
      { t: "Into the maze", o: [O(.45, 3, 0, 5, "Dave navigates using a graph algorithm he wrote on a cornstalk. Team bonds. ×3!"), O(.55, .55, 0, -8, "Oscar emerges Tuesday. Sales emerge never. The farmer bills you for the corn.")] },
      { t: "Book a conference room with snacks", o: [O(.6, 1.2, 0, 2, "Slides, snacks, a whiteboard. Mild bonding achieved."), O(.4, .65, 0, -4, "Everyone spends the offsite on laptops. The only bonding is over the Wi-Fi password.")] } ] },

  { tier: 1, t: "The culture deck is 140 slides. Rita wants to turn it into a stage musical, performed by candidates during their final round.", c: [
      { t: "Mount the musical", o: [O(.45, 3.2, 0, 4, "\"Ship It (Reprise)\" becomes a recruiting hit. Applications quadruple. ×3.2!"), O(.55, .55, 0, -8, "A candidate forgets the bridge of \"Equity Shall Vest\" and sues for emotional damages.")] },
      { t: "Cut it to one slide", o: [O(.6, 1.3, 0, 3, "\"Be kind. Ship things.\" Candidates love it."), O(.4, .6, 0, -5, "Investors think one slide means you have no culture. Chad asks if you're \"OK.\"")] } ] },

  { tier: 1, t: "Rita drafted a LinkedUp post: \"I fired my best engineer today. Here's what it taught me about B2B gratitude. 🙏\" You have not fired anyone.", c: [
      { t: "Let her post it", o: [O(.4, 3.5, 0, 3, "11 million views. 400 applicants who love gratitude. One great hire. ×3.5!"), O(.6, .6, 0, -7, "Your best engineer reads it and, quite reasonably, quits.")] },
      { t: "Make her rewrite it about actually hiring", o: [O(.6, 1.25, 0, 2, "\"We're hiring!\" Six views, two good applicants. Plenty."), O(.4, .65, 0, -4, "Nobody reads it. Rita's personal brand enters a recession.")] } ] },

  { tier: 1, t: "A candidate will accept a 40% salary cut in exchange for the parking spot closest to the door. There is only one such spot. It is yours.", c: [
      { t: "Give him your spot", o: [O(.45, 3, 0, 4, "He arrives 6 seconds earlier daily and compounds it into a product launch. ×3!"), O(.55, .6, 0, -6, "Without the spot, nobody believes you're the CEO. Delivery drivers ask for your manager.")] },
      { t: "Offer him normal salary", o: [O(.6, 1.25, 0, 3, "He takes the money and parks in Siberia. Good engineer."), O(.4, .6, 0, -5, "He joins Gigantica, which offered him a parking spot with a heated mat.")] } ] },

  { tier: 1, t: "Biscuit has won Employee of the Month eleven months running. HR has received a formal, unsigned complaint written in crayon.", c: [
      { t: "Make Biscuit Employee of the Year", o: [O(.45, 2.8, 0, 5, "Morale soars. The complaint was from Kevin, who is now also happy. ×2.8!"), O(.55, .6, 0, -7, "Engineers form a union called Not Dogs. Negotiations stall over treats.")] },
      { t: "Disqualify non-humans", o: [O(.55, 1.25, 0, 2, "Kevin wins. Nobody knows why. Everyone accepts it."), O(.45, .6, 0, -6, "Biscuit lies by the door for a week. Morale and stock option exercise rates collapse.")] } ] },

  { tier: 1, t: "A departing engineer offers to tell you \"the real reason everyone's leaving\" in her exit interview, for $5,000 cash.", c: [
      { t: "Pay for the truth", o: [O(.45, 3, -0.1, 5, "The real reason: the office smells of fish. You fix it. Churn halts. ×3!"), O(.55, .6, 0, -6, "The truth is \"vibes.\" She leaves with the $5K and a branded mug.")] },
      { t: "Send her the standard exit form", o: [O(.6, 1.2, 0, 2, "\"Great culture, wanted a change.\" Lies, but tidy ones."), O(.4, .6, 0, -5, "She posts the truth on a review site for free. It's the fish.")] } ] },

  { tier: 1, t: "Rita wants hot-desking. Every morning the music plays and whoever is standing when it stops works from the kitchen.", c: [
      { t: "Musical chairs it is", o: [O(.45, 3, 0, 4, "Daily cardio boosts productivity. Oscar, in a hard hat, is unbeatable. ×3!"), O(.55, .6, 0, -7, "Penny pulls a hamstring. Dave codes from the fridge and refuses to leave.")] },
      { t: "Everyone gets a desk", o: [O(.6, 1.25, 0, 2, "People have desks. People are happy. Revolutionary."), O(.4, .65, 0, -4, "Desks spark a status war over who's near the plant. HR is busy for a quarter.")] } ] },

  { tier: 1, t: "A candidate says he's a 10x engineer and wants 10x salary. During the interview, it becomes clear he is four interns in a trench coat.", c: [
      { t: "Hire the trench coat", o: [O(.45, 3, 0, 4, "Four interns for one salary is a genuine arbitrage. Output ×3!"), O(.55, .55, 0, -8, "The bottom intern sneezes during a client demo. Deal lost.")] },
      { t: "Hire one intern from the coat", o: [O(.6, 1.3, 0, 3, "The top intern is talented. The other three keep the coat."), O(.4, .6, 0, -5, "You picked the one who was mostly doing the voice.")] } ] },

  { tier: 1, t: "At the whiteboard interview, a candidate refuses to reverse a linked list and instead draws a very good horse.", c: [
      { t: "Hire her as Head of Product", o: [O(.45, 3, 0, 4, "The horse becomes the logo. The logo becomes merch. Merch funds a year. ×3!"), O(.55, .6, 0, -6, "The roadmap is just more horses. Customers want features, not horses.")] },
      { t: "Ask for the linked list again", o: [O(.6, 1.2, 0, 2, "She draws a linked list of horses. Close enough. Decent hire."), O(.4, .65, 0, -4, "She walks out and sells the horse drawing for more than your seed round.")] } ] },

  { tier: 1, t: "The engineer who rage-quit in March wants to return as a \"consultant\" at triple his old rate, to fix the code he left as a \"gift.\"", c: [
      { t: "Pay the ransom", o: [O(.5, 2.8, -0.2, 3, "He removes the gift in a day. Everything gets faster. ×2.8!"), O(.5, .55, 0, -8, "He fixes it, invoices, and leaves a new gift. It is a subscription.")] },
      { t: "Have Dave untangle it", o: [O(.55, 1.3, 0, 3, "Dave fixes it by rewriting it. It's fine, honestly."), O(.45, .6, 0, -6, "Dave untangles it into something worse but more elegant. Outage for a week.")] } ] },

  { tier: 1, t: "Gigantica offers Dave a job. Rita suggests a counter-offer: no raise, but his new title would be \"Distinguished Wizard\" and he gets a cape.", c: [

  { tier: 1, t: "Orders are piling up. Oscar has found a fulfilment warehouse at a bargain price. It is a disused bouncy castle factory, and some products still inflate.", c: [

  { tier: 1, t: "A compliance auditor arrives unannounced. Oscar says he can hide the messy files behind a fake wall he's \"had ready for years.\"", c: [
      { t: "Hide behind the fake wall", o: [O(.4, 3, 0, 4, "The auditor admires the wall's finish and leaves. Audit passed. ×3!"), O(.6, .55, 0, -10, "The auditor leans on the wall. It is a curtain. Penny is in it.")] },
      { t: "Show them everything", o: [O(.6, 1.3, 0, 4, "Messy but honest. You pass with \"notes.\""), O(.4, .6, 0, -6, "\"Everything\" included Oscar's labelled box marked TAX STUFF (DO NOT).")] } ] },

  { tier: 1, t: "A big client wants an uptime SLA. Industry standard is 99.9%. Oscar wants to promise 110%. \"Shows commitment.\"", c: [
      { t: "Promise 110% uptime", o: [O(.45, 3.5, 0, 5, "The client's lawyers can't work out how to breach it. Contract signed. ×3.5!"), O(.55, .6, 0, -8, "You're 10% below SLA every single day by definition. Penalties accrue.")] },
      { t: "Promise 99.9%", o: [O(.6, 1.3, 0, 3, "Signed. Standard. Respectable."), O(.4, .6, 0, -5, "Gigantica promised 99.99%. Client walks. Solomon Vane posts a sermon on reliability.")] } ] },

  { tier: 1, t: "The lift is broken again. Oscar proposes replacing it with a fireman's pole going down and a climbing wall going up.", c: [
      { t: "Pole down, wall up", o: [O(.45, 3, 0, 5, "📰 \"Fittest Startup In Tech\" — recruiting skyrockets. ×3!"), O(.55, .6, 0, -7, "Chad came for the board meeting. He is still on the climbing wall.")] },
      { t: "Pay to fix the lift", o: [O(.6, 1.25, 0, 3, "Lift works. Up. Down. Excellent."), O(.4, .6, 0, -5, "Lift fixed. It now only stops at the floor with the mice.")] } ] },

  { tier: 1, t: "The thermostat war has escalated: Sales has 30°C, Engineering 16°C. Oscar proposes making each team a different climate zone, with passports.", c: [
      { t: "Climate zones and passports", o: [O(.45, 3, 0, 5, "Customers ask for tours. The \"tropical sales floor\" closes deals. ×3!"), O(.55, .6, 0, -7, "Border disputes. Kevin was detained at Engineering customs for six hours.")] },
      { t: "Set it to 21°C, lock the box", o: [O(.6, 1.25, 0, 3, "Equal misery for all. That's leadership."), O(.4, .6, 0, -5, "Someone smuggled in a space heater. Then the fire marshal. Then a fine.")] } ] },

  { tier: 1, t: "A package arrives addressed to Gigantica, delivered to you by mistake. It's ticking. Quietly. Like a nice watch.", c: [
      { t: "Open it", o: [O(.4, 3.5, 0, 4, "It's their entire hardware roadmap on a prototype. You learn a lot. ×3.5!"), O(.6, .55, 0, -10, "📰 \"Startup Opens Rival's Mail\" — Solomon Vane does a 40-minute keynote on ethics.")] },
      { t: "Return to sender", o: [O(.6, 1.3, 0, 4, "Solomon Vane sends a thank-you card. Ethically recycled."), O(.4, .6, 0, -5, "It was a fruit basket meant to poach your whole team. They got it anyway, by courier.")] } ] },

  { tier: 1, t: "Your shipping container is stuck at port for six weeks. Oscar has found a fisherman who'll bring it over in his small boat, \"one box at a time.\"", c: [
      { t: "Hire the fisherman", o: [O(.45, 3, 0, 5, "He's oddly fast. Your stock arrives smelling of the sea. Customers love it. ×3!"), O(.55, .6, 0, -7, "He brought 4,000 fish and no stock. He seems pleased with his work.")] },
      { t: "Wait for the port", o: [O(.6, 1.25, 0, 2, "Container arrives on week six. Customers wait patiently."), O(.4, .6, 0, -6, "The container finally arrives. It's someone else's. It's full of hats.")] } ] },

  { tier: 1, t: "Annual stocktake. Oscar wants to count everything by hand, including the individual grains of rice in the kitchen. \"Inventory is inventory.\"", c: [
      { t: "Count every grain", o: [O(.4, 3, 0, 5, "You discover $2M of stock nobody knew existed in a cupboard. ×3!"), O(.6, .6, 0, -7, "Two weeks counting rice. Final number: \"a lot.\" Oscar labels it.")] },
      { t: "Do a sample count", o: [O(.6, 1.3, 0, 3, "Statistically sound. The auditors nod."), O(.4, .6, 0, -5, "The sample missed the entire second warehouse. Nobody remembers renting it.")] } ] },

  { tier: 1, t: "A supplier offers 200 office chairs at 90% off because they were recalled for \"spinning uncontrollably.\"", c: [
      { t: "Buy the spinning chairs", o: [O(.45, 3, 0, 5, "Turns out spinning boosts ideation. Investors ask for a go. ×3!"), O(.55, .6, 0, -8, "Dave's chair hasn't stopped since Monday. He's still coding, but very dizzy.")] },
      { t: "Pay full price for normal chairs", o: [O(.6, 1.25, 0, 3, "Chairs. They stay still. Backs are supported."), O(.4, .6, 0, -5, "The normal chairs are so comfy that two engineers fell asleep through a launch.")] } ] },

  { tier: 1, t: "The lost & found box is now a lost & found room. It contains 70 jackets, three bikes and a canoe. Oscar has catalogued all of it.", c: [
      { t: "Auction it as limited-edition merch", o: [O(.45, 3, 10, 5, "\"Worn by an engineer\" sells shockingly well. Canoe goes for $40K. ×3!"), O(.55, .6, 0, -7, "One of the jackets was Chad's. He found it at the auction. Lost trust.")] },

  { tier: 1, t: "Oscar has labelled every cable in the server room. Except one. It's black, warm and unlabelled. It goes into the wall.", c: [
      { t: "Pull it out to see what happens", o: [O(.4, 3.5, 0, 5, "Your cloud bill drops 70%. It was mining something for someone. ×3.5!"), O(.6, .6, 0, -9, "Production goes down. Also the building next door. Also a traffic light.")] },

  { tier: 1, t: "Chad is coming to visit. Oscar's visitor sign-in process has 14 steps, a photo booth and a short written exam on fire exits.", c: [
      { t: "Make Chad do all 14 steps", o: [O(.45, 3, 0, 6, "Chad is so impressed by the rigour he doubles his cheque. ×3!"), O(.55, .6, 0, -9, "Chad failed the exam. He's stuck in reception and furious.")] },
      { t: "Waive it for VIPs", o: [O(.6, 1.3, 0, 3, "Chad strolls in. Meeting goes smoothly."), O(.4, .6, 0, -6, "Chad wandered into the server room unattended and unplugged something to charge his phone.")] } ] },

  { tier: 1, t: "There's one bathroom and 40 staff. Oscar has built a booking app for it, with tiers, priority passes and a loyalty scheme.", c: [

  { tier: 1, t: "Oscar's disaster recovery plan is a second office, fully identical, with identical furniture, in case the first one \"goes.\" He's already signed the lease.", c: [
      { t: "Keep the twin office", o: [O(.45, 3, 0, 5, "A flood hits the main office. You switch over in 4 minutes. Investors love it. ×3!"), O(.55, .6, 0, -8, "Nothing happens to the first office. You pay two rents forever.")] },
      { t: "Cancel it, use remote backups", o: [O(.6, 1.3, 0, 3, "Backups in the cloud. Normal and sensible."), O(.4, .6, 0, -6, "A pipe bursts. Backups were stored in a laptop in the flooded office.")] } ] },

  { tier: 1, t: "Oscar wants to replace the snack wall with a vending machine that only accepts company stock options. \"Aligns incentives.\"", c: [
      { t: "Equity vending machine", o: [O(.45, 3, 0, 5, "Staff hoard options instead of crisps. Retention soars. ×3!"), O(.55, .6, 0, -8, "Kevin traded his options for 4,000 crisps. Now he owns more than the founder.")] },
      { t: "Normal snacks, free", o: [O(.6, 1.25, 0, 2, "Free crisps. Everyone's happy and slightly salty."), O(.4, .6, 0, -5, "Snack bill comes in. Penny has cancelled crisps. Morale has followed.")] } ] },

  { tier: 1, t: "Oscar has designed a recycling system with 47 colour-coded bins. There's a bin for \"plastic, but sad.\"", c: [
      { t: "Roll out all 47 bins", o: [O(.45, 3, 0, 5, "📰 \"Greenest Office In The Country\" — impact investors circle. ×3!"), O(.55, .6, 0, -7, "Staff spend 30% of their day sorting rubbish. Velocity collapses.")] },
      { t: "Three bins: trash, recycling, compost", o: [O(.6, 1.3, 0, 3, "Clean, simple, compliant. Planet mildly grateful."), O(.4, .6, 0, -5, "Nobody uses them correctly. The waste company fines you. Oscar silently adds a fourth bin.")] } ] },

  { tier: 1, t: "Biscuit keeps chewing through cables. Oscar proposes rewiring the entire office with cables flavoured like bacon, so Biscuit gets bored of bacon.", c: [
      { t: "Bacon cables", o: [O(.4, 3.5, 0, 5, "Biscuit is now repulsed by bacon. Cable damage zero. Patent filed. ×3.5!"), O(.6, .6, 0, -8, "Biscuit ate the entire network. He seems proud. Board is less proud.")] },
      { t: "Cable covers and a chew toy", o: [O(.6, 1.25, 0, 2, "Biscuit loves his new toy. Cables survive."), O(.4, .6, 0, -5, "Biscuit ignores the toy and eats the cable covers instead. Then the cable.")] } ] },

  { tier: 1, t: "You need a delivery van. Oscar found a used ice-cream truck that's half the price, but the music can't be switched off.", c: [
      { t: "Buy the ice-cream truck", o: [O(.45, 3, 0, 5, "Children chase your deliveries. Viral local legend. Sales triple. ×3!"), O(.55, .6, 0, -7, "Noise complaints from every postcode. The truck is banned after 9am.")] },
      { t: "Buy a boring white van", o: [O(.6, 1.3, 0, 3, "Packages arrive. Nobody sings."), O(.4, .6, 0, -5, "The white van gets clamped on day one. The clamp company is Gigantica-owned.")] } ] },

  { tier: 1, t: "The cheapest warehouse in town is half price because everyone thinks it's haunted. Oscar has already labelled the ghost.", c: [
      { t: "Sign the lease", o: [O(.45, 3.5, 0, 5, "The ghost reorganises stock overnight. Pick rate has never been higher. ×3.5!"), O(.55, .6, 0, -7, "Nobody will work the night shift. Oscar does it alone, with the ghost, happily.")] },
      { t: "Pay more for an unhaunted one", o: [O(.6, 1.25, 0, 2, "Fully unhaunted warehouse. Smooth operations."), O(.4, .6, 0, -5, "The ghost followed you to the new warehouse anyway. And it's annoyed.")] } ] },

      { t: "Build a normal one in a field", o: [O(.6, 1.3, 0, 3, "Built on time. Field is a field. Nothing to report."), O(.4, .6, 0, -6, "📰 \"Gigantica Opens Data Centre In Glacier, Calls Rivals 'Lukewarm'\"")] } ] },

      { t: "Negotiate better freight rates", o: [O(.6, 1.3, 0, 3, "Freight down 12%. Procurement triumphant."), O(.4, .6, 0, -6, "Gigantica bought the canal instead. Your freight now pays their tolls.")] } ] },

  { tier: 2, t: "The architects have pitched a new HQ: a 90-storey building shaped exactly like the founder's face. The meeting rooms are in the nostrils.", c: [
      { t: "Build the face", o: [O(.4, 4, 0, 6, "📰 \"Most Photographed Building On Earth\" — tourism alone covers rent. ×4!"), O(.6, .6, 0, -10, "The face has a disappointed expression. Analysts call it \"a sign.\"")] },
      { t: "Glass rectangle, tasteful", o: [O(.6, 1.3, 0, 3, "Award-winning, quietly. The rectangle shines."), O(.4, .6, 0, -6, "Every company has a glass rectangle. Nobody remembers yours. Stock dips on vibes.")] } ] },

  { tier: 2, t: "Rain keeps ruining outdoor events. Oscar proposes buying a weather-control system so it never rains on campus. \"Climate as a service.\"", c: [

      { t: "Split it into smaller warehouses", o: [O(.6, 1.3, 0, 3, "Manageable sizes. Ops is calm. Oscar mourns quietly."), O(.4, .6, 0, -6, "Splitting it took two years. A storm in aisle 4,000 delayed everything.")] } ] },

      { t: "Regional offsites in hotels", o: [O(.6, 1.3, 0, 3, "Many hotels, many lanyards, one decent week."), O(.4, .6, 0, -6, "Gigantica rented all the cruise ships. Your staff watched them go by from the hotel window.")] } ] },

  { tier: 2, t: "Oscar wants to buy an active volcano for geothermal power. \"It's on fire, but in a controlled way. Like me.\"", c: [
      { t: "Buy the volcano", o: [O(.4, 4, 0, 6, "Free energy forever. Also the coolest company lair in the sector. ×4!"), O(.6, .6, 0, -10, "The volcano is less controlled than advertised. Oscar is fine. The data centre is lava.")] },
      { t: "Sign a solar contract", o: [O(.6, 1.3, 0, 3, "Clean energy. Sensible PR. Good quarter."), O(.4, .6, 0, -6, "Solar farm installed. Cloudiest year on record. Oscar didn't say anything.")] } ] },

  { tier: 2, t: "Oscar proposes a submarine logistics network. \"No traffic. No weather. Just us and the fish.\"", c: [
      { t: "Launch the submarine fleet", o: [O(.45, 3.5, 0, 6, "Deliveries pop out of the harbour like magic. Shipping costs halved. ×3.5!"), O(.55, .6, 0, -9, "A whale has adopted one of your submarines. Nobody can get it back.")] },
      { t: "Stick with container ships", o: [O(.6, 1.3, 0, 3, "Ships ship. The fish are undisturbed."), O(.4, .6, 0, -6, "Rex Halberd launches a submarine network. He names it after you, sarcastically.")] } ] },

      { t: "Move the router", o: [O(.6, 1.3, 0, 3, "Moved the router. Wi-Fi fixed. The fridge remains."), O(.4, .6, 0, -6, "Moving the router broke 300 smart lightbulbs. HQ is now in eternal disco mode.")] } ] },

  { tier: 2, t: "Warehousing costs on land are huge. Oscar proposes a fleet of airships as floating warehouses that drift above the world's major cities.", c: [

      { t: "Lease warehouses on the ground", o: [O(.6, 1.3, 0, 3, "Warehouses with floors. Everything is where you left it."), O(.4, .6, 0, -6, "Every good warehouse is owned by Gigantica. You're renting one from them now.")] } ] },

      { t: "Buy Gigantica's building", o: [O(.4, 4, 0, 6, "Solomon Vane now rents from you. He has to say \"thank you\" every month. ×4!"), O(.6, .6, 0, -10, "You bought it. Gigantica moved out. The building was full of bad wiring and one angry ghost.")] },
      { t: "Build the wall", o: [O(.6, 1.3, 0, 3, "Very big wall. Lovely shade. Morale up."), O(.4, .6, 0, -6, "Gigantica painted their side with a mural of you looking sad. It's on every postcard.")] } ] },

  { tier: 2, t: "Shipping costs are a nightmare. Oscar suggests buying the entire national postal service, including the vans and the dogs who chase them.", c: [

      { t: "Sign a bulk shipping deal", o: [O(.6, 1.3, 0, 3, "Discounted shipping. Tidy margin bump."), O(.4, .6, 0, -6, "Rex Halberd bought the postal service and lost all your parcels for fun.")] } ] },

      { t: "8 billion hoodies", o: [O(.45, 3.5, 0, 6, "The whole world matches. Brand awareness: total. ×3.5!"), O(.55, .6, 0, -10, "Worldwide cotton shortage. Sheep are being questioned by authorities.")] },
      { t: "Hoodies for staff only", o: [O(.6, 1.3, 0, 2, "Staff look sharp. Hoodie budget sane."), O(.4, .6, 0, -6, "Staff hoodies leaked online and resold for thousands. You weren't in on it.")] } ] },

      { t: "Corner the cardboard market", o: [O(.4, 4, 0, 5, "Every parcel on Earth earns you a cent. Analysts say \"cardboard baron.\" ×4!"), O(.6, .6, 0, -10, "Customers switch to bubble wrap out of spite. You have nine mountains of boxes.")] },
      { t: "Lock in a long-term box contract", o: [O(.6, 1.3, 0, 3, "Boxes secured at a decent rate. Supply chain steady."), O(.4, .6, 0, -6, "Gigantica cornered cardboard instead. Your products now ship in envelopes.")] } ] },

  { tier: 2, t: "Customer support needs 200,000 more agents. Oscar has found a mid-sized city willing to become your support centre, entire population included.", c: [
      { t: "Hire the city", o: [O(.45, 3, 0, 5, "Every resident is polite, local and on the phone. Satisfaction 98%. ×3!"), O(.55, .6, 0, -9, "The city elected a mayor who now demands your seat on the board.")] },
      { t: "Hire an outsourcing firm", o: [O(.6, 1.3, 0, 3, "Tickets answered. Mostly correctly. Nobody complains much."), O(.4, .6, 0, -6, "The outsourcing firm is secretly Gigantica. Solomon Vane is reading your tickets.")] } ] },

      { t: "Accept the shark island", o: [O(.45, 3.5, 0, 6, "Unbreachable security. The sharks guard the servers. ×3.5!"), O(.55, .6, 0, -9, "Rex keeps visiting the servers with his sharks. He changes the passwords.")] },
      { t: "Use a backup site inland", o: [O(.6, 1.3, 0, 3, "A boring site, dry, shark-free."), O(.4, .6, 0, -6, "The inland site was in a flood zone. Rex sends a shark emoji. Nothing else.")] } ] },

      { t: "Replace them with humans", o: [O(.6, 1.3, 0, 3, "Humans: slower, but happier to see you."), O(.4, .6, 0, -6, "The humans also unionise. Their demands include \"no robots.\"")] } ] },

      { t: "Build the rolling HQ", o: [O(.4, 4, 0, 6, "Every city is now on the way. Customers board for demos. ×4!"), O(.6, .6, 0, -10, "The road train missed a turn. The office is now in a desert. Wi-Fi is spotty.")] },
      { t: "Keep the building where it is", o: [O(.6, 1.3, 0, 3, "Stationary. Sensible. Next to a nice coffee place."), O(.4, .6, 0, -6, "Gigantica launched a rolling HQ. It parked outside yours. It honks.")] } ] },

function applyOutcome(who, out, choiceText, onDone) {

  else if (choiceText && raw <= .75 && Math.random() < MELTDOWN) { raw = raw * raw; twist = "meltdown"; }

    if (!G.worst || ratio < G.worst.r) G.worst = { r: ratio, t: choiceText };

const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function walkable(x, y, ignoreDog) {
  if (x < 0 || y < 0 || x >= MW || y >= MH) return false;
  if (zone[y][x] === "#") return false;
  if (solidProp(x, y) || npcAt(x, y)) return false;
  if (!ignoreDog && dog.x === x && dog.y === y) return false;
  return true;
}
function interactAt(x, y) {
  const n = npcAt(x, y); if (n) { talkTo(n); return true; }
  if (dog.x === x && dog.y === y) { SFX.bark(); showDialog({ who: { name: "Biscuit", title: "Chief Vibes Officer", emoji: "🐶" }, text: pick(DOG), choices: OK(null, "Good boy") }); return true; }
  const p = solidProp(x, y);
  if (p && p.talk) { if (p.sfx) SFX[p.sfx](); showDialog({ who: { name: "You", title: "Founder & CEO", look: FOUNDER }, text: pick(p.talk), choices: OK(null, "Back to work") }); return true; }
  return false;
}
function tryMove(dir) {
  player.dir = dir;
  const [dx, dy] = DIRV[dir], nx = player.x + dx, ny = player.y + dy;
  if (walkable(nx, ny)) { player.moving = true; player.fx = player.x; player.fy = player.y; player.x = nx; player.y = ny; player.t = 0; return true; }
  if (!interactAt(nx, ny)) { if (!player.bumpAt || now() - player.bumpAt > 250) { SFX.bump(); player.bumpAt = now(); } }
  return false;
}
function heldDir() { return keys.length ? keys[keys.length - 1] : null; }
function bfs(sx, sy, goalFn) {
  const prev = new Map(), q = [[sx, sy]], k = (x, y) => x + "," + y; prev.set(k(sx, sy), null);
  while (q.length) {
    const [x, y] = q.shift();
    if (goalFn(x, y)) { const path = []; let c = k(x, y); while (prev.get(c)) { path.unshift(c.split(",").map(Number)); c = prev.get(c); } return path; }
    for (const [dx, dy] of Object.values(DIRV)) { const nx = x + dx, ny = y + dy; if (!prev.has(k(nx, ny)) && walkable(nx, ny, true)) { prev.set(k(nx, ny), k(x, y)); q.push([nx, ny]); } }
  }
  return null;
}
function tapTile(tx, ty) {
  if (dialog || G.over || !$("ov").classList.contains("hidden")) return;
  const isTarget = (x, y) => npcAt(x, y) || (dog.x === x && dog.y === y) || (solidProp(x, y) && solidProp(x, y).talk);
  if (isTarget(tx, ty)) {
    const adj = (x, y) => Object.values(DIRV).some(([dx, dy]) => x + dx === tx && y + dy === ty);
    const path = bfs(player.x, player.y, adj);
    if (path) { player.path = path; player.target = [tx, ty]; }
    return;
  }
  if (!walkable(tx, ty, true)) return;
  const path = bfs(player.x, player.y, (x, y) => x === tx && y === ty);
  if (path) { player.path = path; player.target = null; }
}
function dirTo(x, y) { const dx = x - player.x, dy = y - player.y; return dx > 0 ? "right" : dx < 0 ? "left" : dy > 0 ? "down" : "up"; }
function updatePlayer(dt) {
  if (player.moving) {
    player.t += dt / 125;
    if (player.t >= 1) { player.moving = false; player.step++; player.px = player.x; player.py = player.y; }
    else { player.px = player.fx + (player.x - player.fx) * player.t; player.py = player.fy + (player.y - player.fy) * player.t; return; }
  }
  if (dialog || G.over || G.paused || !$("ov").classList.contains("hidden")) { player.path = []; return; }
  const h = heldDir();
  if (h) { player.path = []; player.target = null; tryMove(h); return; }
  if (player.path.length) {
    const [nx, ny] = player.path[0];
    if (!walkable(nx, ny)) { if (dog.x === nx && dog.y === ny) return; player.path = []; return; }
    player.path.shift(); tryMove(dirTo(nx, ny));
    return;
  }
  if (player.target) { const [tx, ty] = player.target; player.target = null; player.dir = dirTo(tx, ty); interactAt(tx, ty); }
}
function updateDog(dt, t) {
  if (dog.moving) {
    dog.t += dt / 260;
    if (dog.t >= 1) { dog.moving = false; dog.px = dog.x; dog.py = dog.y; } else { dog.px = dog.fx + (dog.x - dog.fx) * dog.t; dog.py = dog.fy + (dog.y - dog.fy) * dog.t; }
    return;
  }
  if (t < dog.next) return;
  dog.next = t + rand(500, 1800);
  const opts = Object.entries(DIRV).filter(([d, [dx, dy]]) => { const x = dog.x + dx, y = dog.y + dy; return zone[y][x] === "hall" && walkable(x, y, true) && !(player.x === x && player.y === y); });
  if (!opts.length) return;
  const [d, [dx, dy]] = pick(opts);
  if (d === "left" || d === "right") dog.dir = d;
  dog.fx = dog.x; dog.fy = dog.y; dog.x += dx; dog.y += dy; dog.t = 0; dog.moving = true;
}

/* ============================================================
   RENDER
   ============================================================ */
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function label(text, x, y, size, col, bg) {
  ctx.font = `900 ${size}px ui-rounded, system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (bg) { const w = ctx.measureText(text).width + 8; R(x - w / 2 - 1, y - size / 2 - 3, w + 2, size + 6, "#1d1d2b"); R(x - w / 2, y - size / 2 - 2, w, size + 4, bg); }
  ctx.fillStyle = col; ctx.fillText(text, x, y + .5);
}
function emo(e, x, y, size, rot) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  ctx.fillStyle = "#000"; ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(e, 0, 0);
  ctx.restore();
}
function zoneBelow(x, y) { const z = y + 1 < MH ? zone[y + 1][x] : "#"; return z === "#" ? null : z; }
function drawTiles(t) {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const z = zone[y][x], X = x * T, Y = y * T;
    if (z === "#") {
      const below = zoneBelow(x, y);
      if (below && below !== "door") {
        const wc = ZONES[below] ? ZONES[below].wall : "#f3e6cf";
        R(X, Y, T, T, wc); R(X, Y, T, 3, "#6d5f8f"); R(X, Y + 3, T, 1, shade(wc, -.08)); R(X, Y + 13, T, 3, "#b69a74"); R(X, Y + 13, T, 1, "#8a7254");
      } else { R(X, Y, T, T, "#4a4063"); R(X, Y, T, 2, "#5d5278"); }
    } else if (z === "hall") {
      const st = G.stage;
      if (st >= 5) { R(X, Y, T, T, "#1b1d3a"); if ((x * 7 + y * 13) % 5 === 0) R(X + (x * 5) % 13, Y + (y * 3) % 13, 1, 1, Math.floor(t / 400 + x) % 3 ? "#fff" : "#9fd8ff"); }
      else if (st >= 2) { R(X, Y, T, T, (x + y) % 2 ? "#f1eee9" : "#e7e3dc"); R(X + (x * 3) % 11, Y + 3, 5, 1, "#d7d1c7"); R(X + 2 + (y * 5) % 9, Y + 11, 4, 1, "#d7d1c7"); }
      else { R(X, Y, T, T, "#e6c49a"); R(X, Y + 7, T, 1, "#d4ae82"); R(X, Y + 15, T, 1, "#d4ae82"); R(X + ((y * 7) % 16), Y, 1, 7, "#d4ae82"); R(X + ((y * 7 + 9) % 16), Y + 8, 1, 7, "#d4ae82"); }
      if (st >= 4 && y === 7) { R(X, Y + 2, T, 12, "#a3142a"); R(X, Y + 2, T, 1, "#e0b13a"); R(X, Y + 13, T, 1, "#e0b13a"); }
    } else if (z === "door") {
      R(X, Y, T, T, "#e6c49a"); R(X + 2, Y + 3, 12, 10, "#7a4e3a"); R(X + 3, Y + 4, 10, 8, "#9c6a4c");
    } else {
      const f = ZONES[z].floor; R(X, Y, T, T, (x + y) % 2 ? f[0] : f[1]);
    }
  }
  // room name signs on the back wall of each room
  const signs = [["hire", 3, 0], ["product", 8, 0], ["fund", 16, 0], ["finance", 4.5, 9], ["ops", 14, 9]];
  signs.forEach(([z, x, y]) => label(`${ZONES[z].icon} ${ZONES[z].name}`, x * T + 8, y * T + 8, 7, "#1d1d2b", G.stage >= 2 ? "#ffd75e" : "#fff7d6"));
  if (G.stage >= 1) { // neon sign in the hallway
    ctx.save(); ctx.shadowColor = "#ff4fd8"; ctx.shadowBlur = Math.floor(t / 700) % 7 ? 6 : 1;
    label(G.stage >= 5 ? "TO INFINITY" : G.stage >= 3 ? "SYNERGY" : "HUSTLE", 14 * T + 8, 5 * T + 8, 6.5, "#ff7ae0", "#2a1838");
    ctx.restore();
  }
  if (G.stage >= 4) { R(5 * T + 3, 5 * T + 11, 10, 5, "#1d1d2b"); R(5 * T + 4, 5 * T + 12, 8, 3, "#d4a017"); emo("🗿", 5 * T + 8, 5 * T + 6, 11); }
  // hall posters & windows
  [[1, 5], [8, 5], [12, 5], [18, 5]].forEach(([x, y], i) => {
    const X = x * T, Y = y * T;
    if (i % 2 === 0) {
      const sky = G.stage >= 5 ? "#0b0d24" : G.stage >= 4 ? "#ff9a6b" : "#9fd8ff";
      R(X + 2, Y + 4, 12, 8, "#1d1d2b"); R(X + 3, Y + 5, 10, 6, sky);
      if (G.stage >= 5) { R(X + 4, Y + 6, 1, 1, "#fff"); R(X + 10, Y + 7, 1, 1, "#fff"); R(X + 6, Y + 9, 1, 1, "#fff"); }
      else if (G.stage >= 4) { R(X + 3, Y + 8, 10, 3, "#ffcf6b"); R(X + 4, Y + 9, 2, 2, "#6b3a5a"); R(X + 9, Y + 8, 2, 3, "#6b3a5a"); }
      R(X + 3, Y + 8, 10, 1, "#1d1d2b"); R(X + 8, Y + 5, 1, 6, "#1d1d2b");
    } else {
      const frame = G.stage >= 3 ? "#d4a017" : "#1d1d2b";
      R(X + 3, Y + 3, 10, 10, frame); R(X + 4, Y + 4, 8, 8, i === 1 ? "#ffe27a" : "#ffc3d8");
      emo(G.stage >= 5 ? (i === 1 ? "🪐" : "🚀") : G.stage >= 3 ? (i === 1 ? "💎" : "🏆") : (i === 1 ? "📈" : "🦄"), X + 8, Y + 8.5, 6);
    }
  });
  // whiteboard on product wall
  const WB = 10 * T + 2;
  R(WB, 4, 28, 9, "#1d1d2b"); R(WB + 1, 5, 26, 7, "#fff");
  if (Math.floor(t / 900) % 2) R(WB + 3, 7, 8, 1, "#e0384b");
  R(WB + 12, 9, 9, 1, "#3a6fe0"); R(WB + 21, 6, 4, 3, "#23a559");
}
function drawProp(p, t) {
  const X = p.x * T, Y = p.y * T, W = p.w * T, H = p.h * T, O = "#1d1d2b";
  switch (p.d) {
    case "plant":
      if (G.stage >= 3) { R(X + 4, Y + 10, 8, 5, O); R(X + 5, Y + 11, 6, 3, "#d4a017"); emo("🌴", X + 8, Y + 5, 13, Math.sin(t / 900 + X) * .06); break; }
      R(X + 4, Y + 9, 8, 6, O); R(X + 5, Y + 10, 6, 4, "#c2683e");
      R(X + 3, Y + 2, 10, 8, O); R(X + 4, Y + 3, 8, 6, "#4caf50"); R(X + 6, Y + 1, 4, 3, O); R(X + 7, Y + 1, 2, 3, "#66c46a"); R(X + 5, Y + 4, 2, 2, "#7fd383"); break;
    case "desk": case "founderdesk":
      R(X, Y + 4, W, 10, O); R(X + 1, Y + 5, W - 2, 5, "#b07a45"); R(X + 1, Y + 10, W - 2, 3, "#8a5a30");
      R(X + W / 2 - 6, Y - 2, 12, 9, O); R(X + W / 2 - 5, Y - 1, 10, 6, p.d === "founderdesk" ? "#ffb3c7" : "#7fd3ff");
      if (Math.floor(t / 500) % 2) R(X + W / 2 - 3, Y + 1, 4, 1, "#fff");
      if (p.d === "founderdesk") emo("🌯", X + 4, Y + 6, 6);
      if (p.x === 6) emo("🧮", X + 25, Y + 6, 7);
      break;
    case "chairs": for (let i = 0; i < p.w; i++) { R(X + i * T + 3, Y + 3, 10, 10, O); R(X + i * T + 4, Y + 4, 8, 5, "#e85d9e"); R(X + i * T + 4, Y + 9, 8, 3, "#b53f78"); } break;
    case "lab": R(X, Y + 4, W, 10, O); R(X + 1, Y + 5, W - 2, 8, "#e8eef5"); emo("🧪", X + 7, Y + 5, 8); emo("🦆", X + 22, Y + 6, 8); break;
    case "beanbag": R(X + 2, Y + 5, 12, 9, O); R(X + 3, Y + 6, 10, 7, "#ff9a3c"); R(X + 4, Y + 7, 4, 2, "#ffc07d"); break;
    case "couch": R(X, Y + 2, W, 12, O); R(X + 1, Y + 3, W - 2, 5, "#7b5cd6"); R(X + 1, Y + 8, W - 2, 5, "#9a7cf0"); R(X + 1, Y + 3, 3, 10, "#6a4cc4"); R(X + W - 4, Y + 3, 3, 10, "#6a4cc4"); break;
    case "ctable": R(X + 2, Y + 5, 12, 8, O); R(X + 3, Y + 6, 10, 5, "#d9c2ff"); emo("🥂", X + 8, Y + 7, 7); break;
    case "shark": R(X + 3, Y + 10, 10, 5, O); R(X + 4, Y + 11, 8, 3, "#c9a227"); emo("🦈", X + 8, Y + 5 + Math.sin(t / 400), 11); break;
    case "vault":
      R(X, Y, W, H, O); R(X + 1, Y + 1, W - 2, H - 2, "#8e9aa8");
      ctx.fillStyle = O; ctx.beginPath(); ctx.arc(X + 16, Y + 16, 13, 0, 7); ctx.fill(); ctx.fillStyle = "#b8c3cf"; ctx.beginPath(); ctx.arc(X + 16, Y + 16, 12, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(X + 16, Y + 16); ctx.rotate(t / 1500); R(-7, -1, 14, 2, O); R(-1, -7, 2, 14, O); ctx.restore(); break;
    case "money": R(X + 4, Y + 9, 8, 6, O); R(X + 5, Y + 10, 6, 4, "#c2683e"); emo("💸", X + 8, Y + 5 + Math.sin(t / 300), 9); break;
    case "files": for (let i = 0; i < p.w; i++) { R(X + i * T + 2, Y, 12, 15, O); R(X + i * T + 3, Y + 1, 10, 13, "#9aa5b1"); R(X + i * T + 3, Y + 7, 10, 1, O); R(X + i * T + 7, Y + 3, 2, 1, O); R(X + i * T + 7, Y + 10, 2, 1, O); } break;
    case "servers":
      for (let i = 0; i < p.w; i++) {
        const sx = X + i * T; R(sx + 1, Y - 6, 14, 21, O); R(sx + 2, Y - 5, 12, 19, "#2f3640");
        for (let j = 0; j < 4; j++) { R(sx + 3, Y - 3 + j * 4, 10, 2, "#3d4654"); R(sx + 11, Y - 3 + j * 4, 1, 1, (Math.floor(t / 180) + i + j) % 3 ? "#4cff7a" : "#ff5a5a"); }
      } break;
    case "boxes":
      [[0, 0], [16, 0], [0, 16], [16, 16], [8, -6]].forEach(([dx, dy], i) => { if (i === 4 || dy < H) { R(X + dx + 1, Y + dy + 2, 14, 13, O); R(X + dx + 2, Y + dy + 3, 12, 11, "#d6a564"); R(X + dx + 2, Y + dy + 7, 12, 1, "#b8864a"); } }); break;
    case "redbtn": R(X + 3, Y + 8, 10, 7, O); R(X + 4, Y + 9, 8, 5, "#555"); ctx.fillStyle = O; ctx.beginPath(); ctx.arc(X + 8, Y + 8, 5, 0, 7); ctx.fill(); ctx.fillStyle = Math.floor(t / 400) % 2 ? "#ff3b3b" : "#c91e1e"; ctx.beginPath(); ctx.arc(X + 8, Y + 8, 4, 0, 7); ctx.fill(); break;
    case "coffee": R(X + 2, Y, 12, 15, O); R(X + 3, Y + 1, 10, 13, G.stage >= 3 ? "#d4a017" : "#c0392b"); R(X + 5, Y + 3, 6, 3, "#2c2c2c"); R(X + 6, Y + 9, 4, 4, "#fff"); if (Math.floor(t / 300) % 3 === 0) R(X + 7, Y + 6, 1, 2, "#e6e6e6"); break;
    case "pingpong": R(X, Y + 3, W, 11, O); R(X + 1, Y + 4, W - 2, 9, "#2e8b57"); R(X + W / 2, Y + 3, 1, 11, "#fff"); R(X + 1, Y + 8, W - 2, 1, "#fff");
      { const k = (Math.sin(t / 250) + 1) / 2; R(X + 4 + k * (W - 10), Y + 6 - Math.abs(Math.sin(t / 125)) * 4, 2, 2, "#fff"); } break;
  }
}
function shadow(x, y, w) { ctx.fillStyle = "rgba(29,29,43,.22)"; ctx.beginPath(); ctx.ellipse(x, y, w, 2.5, 0, 0, 7); ctx.fill(); }
function draw(t) {
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  drawTiles(t);
  props.forEach(p => drawProp(p, t));
  // entities sorted by y
  const ents = [];
  ALL_NPCS().forEach(n => ents.push({ y: n.y, draw: () => {
    const X = n.x * T, Y = n.y * T, bob = Math.floor(t / 600 + n.x) % 2;
    shadow(X + 8, Y + 15, 6);
    const face = Math.abs(player.x - n.x) + Math.abs(player.y - n.y) <= 2 ? dirFromTo(n, player) : "down";
    ctx.drawImage(personSprite(n.look, face, 0), X, Y - 3 - bob * .5 + .5);
    if (n === HALL.kevin) emo("💤", X + 13, Y - 6 + Math.sin(t / 500) * 2, 7);
    if (n === HALL.gideon && gideonReady()) emo("🎤", X + 8, Y - 10 + Math.sin(t / 180) * 2, 9);
    if (!n.hall && active.includes(n.zone) && !G.over) {
      const by = Y - 15 + Math.sin(t / 180) * 2;
      R(X + 3, by - 1, 10, 11, "#1d1d2b"); R(X + 4, by, 8, 9, "#ffe27a"); R(X + 7, by + 10, 2, 2, "#1d1d2b");
      R(X + 7, by + 1, 2, 5, "#e0384b"); R(X + 7, by + 7, 2, 1, "#e0384b");
    }
  } }));
  ents.push({ y: dog.py, draw: () => { const X = dog.px * T, Y = dog.py * T; shadow(X + 8, Y + 14, 6); ctx.drawImage(dogSprite(dog.dir, dog.moving ? Math.floor(t / 120) : Math.floor(t / 400)), X - 1, Y + 3); if (G.stage >= 3) emo("👑", X + (dog.dir === "left" ? 3 : 13), Y + 2, 6); } });
  ents.push({ y: player.py, draw: () => {
    const X = player.px * T, Y = player.py * T;
    shadow(X + 8, Y + 15, 6);
    const fr = player.moving ? (player.t < .5 ? 1 + (player.step % 2) : 0) : 0;
    const look = FOUNDER_LOOKS[G.stage >= 5 ? 3 : G.stage >= 4 ? 2 : G.stage >= 2 ? 1 : 0];
    ctx.drawImage(personSprite(look, player.dir, fr), X, Y - 3 - (fr ? 1 : 0));
  } });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  // tap target marker
  if (player.path.length && !player.target) { const [lx, ly] = player.path[player.path.length - 1]; ctx.strokeStyle = "rgba(255,122,89,.9)"; ctx.lineWidth = 1; ctx.strokeRect(lx * T + 2.5, ly * T + 2.5, 11, 11); }
  // particles
  particles.forEach(p => emo(p.e, p.x, p.y, 10, p.rot));
  // dark vignette when game over
  if (G.over) { ctx.fillStyle = "rgba(29,29,43,.25)"; ctx.fillRect(0, 0, MW * T, MH * T); }
}
function dirFromTo(a, b) { const dx = b.x - a.x, dy = b.y - a.y; return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"); }

/* ============================================================
   LOOP
   ============================================================ */
function frame(t) {
  const dt = Math.min(60, t - lastT); lastT = t;
  updatePlayer(dt); updateDog(dt, t); typeTick(t);
  // valuation counter animates in log space
  if (Math.abs(G.shown - G.val) > .001) {
    const a = Math.log(Math.max(G.shown, .01)), b = Math.log(Math.max(G.val, .01));
    G.shown = Math.exp(a + (b - a) * .08); if (Math.abs(b - a) < .002) G.shown = G.val;
    $("val").textContent = fmt(G.shown);
  }
  particles.forEach(p => { p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.rot += p.vr; p.life += dt; });
  particles = particles.filter(p => p.y < MH * T + 20 && p.life < 6000);
  draw(t);
  requestAnimationFrame(frame);
}

/* ============================================================
   INPUT
   ============================================================ */
const KEYMAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
addEventListener("keydown", e => {
  initAudio();
  if (e.key === "m" || e.key === "M") { toggleMute(); return; }
  const d = KEYMAP[e.key];
  if (!$("ov").classList.contains("hidden")) {
    if (e.key === "Enter" || e.key === " ") { const b = $("card").querySelector("button"); if (b) { e.preventDefault(); b.click(); } }
    return;
  }
  if (dialog) {
    e.preventDefault();
    if (dialog.typing && (e.key === "Enter" || e.key === " " || e.key === "z" || e.key === "Z")) { finishTyping(); return; }
    if (d === "up") moveSel(-1);
    else if (d === "down") moveSel(1);
    else if (e.key === "Enter" || e.key === " " || e.key === "z" || e.key === "Z") choose(dialog.sel);
    else if (/^[1-9]$/.test(e.key) && !dialog.typing) choose(+e.key - 1);
    return;
  }
  if (d) { e.preventDefault(); if (!keys.includes(d)) keys.push(d); return; }
  if (e.key === "Enter" || e.key === " " || e.key === "z" || e.key === "Z") {
    e.preventDefault(); if (!player.moving) { const [dx, dy] = DIRV[player.dir]; interactAt(player.x + dx, player.y + dy); }
  }
});
addEventListener("keyup", e => { const d = KEYMAP[e.key]; if (d) keys = keys.filter(k => k !== d); });
addEventListener("blur", () => keys = []);
cv.addEventListener("pointerdown", e => {
  initAudio();
  if (dialog) { if (dialog.typing) finishTyping(); return; }
  const r = cv.getBoundingClientRect();
  const tx = Math.floor((e.clientX - r.left) / r.width * MW), ty = Math.floor((e.clientY - r.top) / r.height * MH);
  tapTile(tx, ty);
});
$("dlg").addEventListener("pointerdown", e => { if (dialog && dialog.typing && !e.target.closest("button")) finishTyping(); });
function toggleMute() { muted = !muted; localStorage.setItem("fl-muted", muted ? "1" : "0"); applyMute(); }
$("muteBtn").addEventListener("click", () => { initAudio(); toggleMute(); });
$("hint").textContent = matchMedia("(pointer: coarse)").matches ? "Tap to walk · tap a person to talk" : "Arrow keys / WASD to walk · walk into people to talk · Space to interact · M to mute · or click to walk";

/* boot */
titleScreen();
requestAnimationFrame(t => { lastT = t; frame(t); });
</script>
